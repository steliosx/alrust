# What the `savedq` patch of scripts/bench/alerta_fast.py (an add-on for
# stock Alerta 9.1.0) changes for whole HTTP requests under gunicorn:
# scripts/bench/savedq_load.py, on one GitHub-hosted runner with PostgreSQL
# 18.7 and the reference Alerta environment of scripts/bench/setup.sh.
# Synthetic data only; relative numbers of one runner, not a capacity
# claim. A pull request runs "quick" (plumbing: short cells, nothing to
# read from its numbers); "full" is by dispatch only (DECISIONS Y69). Not a
# required check.
name: addon savedq load

on:
  workflow_dispatch:
    inputs:
      mode:
        description: quick (plumbing) or full (the comparison)
        type: choice
        options: [quick, full]
        default: quick
  pull_request:
    paths:
      - scripts/bench/alerta_fast.py
      - scripts/bench/savedq_load.py
      - scripts/bench/setup.sh
      - .github/workflows/addon-savedq-load.yml

permissions:
  contents: read

concurrency:
  group: addon-savedq-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: savedq under gunicorn (relative numbers only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'quick' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          # The reference Alerta is installed from the pinned submodule.
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node24)
        with:
          python-version: "3.12"
      - name: Self-test
        run: python3 -I -B scripts/bench/savedq_load.py --self-test
      - name: PostgreSQL 18.7 and the reference Alerta environment
        timeout-minutes: 10
        run: scripts/bench/setup.sh
      - name: savedq load
        timeout-minutes: 30
        run: |
          set -euo pipefail
          echo "mode: $BENCH_MODE"
          python3 -I -B scripts/bench/savedq_load.py "$RUNNER_TEMP/savedq-load-out"
      - name: Summary
        if: always()
        run: |
          f="$RUNNER_TEMP/savedq-load-out/summary.md"
          if [ -f "$f" ]; then cat -- "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no summary file"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node24)
        if: always()
        with:
          name: addon-savedq-load
          path: ${{ runner.temp }}/savedq-load-out/
          if-no-files-found: warn

name: bench compare
run-name: Two-site Alerta dashboard replay
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify workload, cache accounting and archived laptop measurements offline
        run: |
          python -B -m unittest discover -s scripts/bench/dual-site -p 'test_*.py'
          python -B scripts/bench/dual-site/cache_replay_evidence.py verify docs/performance/2026-11-21-two-site-varnish-samples.json.gz
      - name: Install the repository's reference server and PostgreSQL
        timeout-minutes: 20
        run: bash scripts/bench/setup.sh
      - name: Install the pinned cache, proxy and quorum tools
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        timeout-minutes: 25
        run: bash scripts/bench/dual-site/hosted-setup.sh
      - name: Run independent cache-off and one-second pairs in sequence
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        timeout-minutes: 180
        run: python -B scripts/bench/dual-site/hosted_matrix.py
      - name: Upload verified synthetic receipts and completion status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: two-site-cache-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cache-public/matrix.json
            ${{ runner.temp }}/cache-public/samples.json.gz
          if-no-files-found: warn
          retention-days: 14

# alrust and Alerta 9.1.0 side by side (scripts/bench/bench_compare.py):
# a diagnostic benchmark on one GitHub-hosted runner, PostgreSQL 18.7
# (alrust's pin since #226, Y67), synthetic data only. The numbers are relative to the runner,
# not a capacity claim. Not a required check. When it runs (the owner's
# choice, DECISIONS Y69): a full run only when a person starts it
# (workflow_dispatch, mode "full" by default); a pull request that changes
# the benchmark runs only the quick check (1 repetition, c=1, 5 s) of every
# suite. The mixed suite is docs/performance/benchmark-methodology.md. The
# tuning suite compares deployment settings of Alerta (no change to its
# code): its arms are listed at the top of bench_compare.py. The cache suite
# puts a short-lived response cache in front of Alerta
# (scripts/bench/cache_suite.py). The pg19 suite runs Alerta on PostgreSQL
# 18.7 and 19 side by side (scripts/bench/pg_suite.py). The fastpath
# suite measures the write path with Alerta's default plugins, with and
# without the add-on's `noecho` patch (the top of bench_compare.py). The
# pgtune suite measures PostgreSQL changes one at a time; step 1 is the ID
# prefix index alone, at 1,000 or 100,000 alerts (scripts/bench/pgtune_suite.py).
name: bench compare

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full (3 repetitions, c=1 and c=8) or quick (plumbing only)"
        type: choice
        options: [full, quick]
        default: full
      suite:
        description: "compare (the four arms), mixed (writers and readers together; pool and key-use sweeps), both, tuning (Alerta deployment settings), addon (alerta_fast.py patches), fastpath (the write path with Alerta's default plugins), cache (a response cache in front of Alerta), pg19 (Alerta on PostgreSQL 18.7 and 19), pgtune (PostgreSQL changes; step 1: the ID prefix index) or all (quick mode only)"
        type: choice
        options: [compare, mixed, both, tuning, addon, fastpath, cache, pg19, pgtune, all]
        default: compare
      pgtune_rows:
        description: "pgtune suite only: alerts in every pgtune copy (pull requests use 100000)"
        type: choice
        options: ["100000", "1000"]
        default: "100000"
      occupy_5433:
        description: "regression check, quick compare only: another process holds port 5433 during the setup"
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/bench/**
      - .github/workflows/bench-compare.yml

permissions:
  contents: read

concurrency:
  group: bench-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: alrust vs Alerta (PostgreSQL 18.7, relative numbers only)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # A full run of every suite needs more than the benchmark step's time:
      # refused here, before anything is built.
      - name: Refuse full mode with suite all
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.suite == 'all'
        run: |
          echo "::error::suite 'all' is for quick mode only. Start one full run for each of compare, mixed, both, tuning, addon, fastpath, cache, pg19 or pgtune."
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          # The reference Alerta is installed from the pinned submodule.
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node24)
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master resolved 2026-11-06
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 resolved 2026-11-06
      - name: Build alrust (release)
        timeout-minutes: 20
        run: |
          cargo build --locked --release --bin alrust
          echo "ALRUST_BIN=$GITHUB_WORKSPACE/target/release/alrust" >> "$GITHUB_ENV"
      - name: Install oha 1.17.0 (crates.io, locked)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Outside the checkout, so the repository's Cargo config does not apply.
          cd "$RUNNER_TEMP"
          cargo install oha --version 1.17.0 --locked --root "$RUNNER_TEMP/oha"
          echo "OHA_BIN=$RUNNER_TEMP/oha/bin/oha" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/oha/bin/oha" --version
          "$RUNNER_TEMP/oha/bin/oha" --help
      # The mixed suite's gates, tested without a server. First of the
      # benchmark steps, so a broken gate stops the job before anything runs.
      - name: Mixed suite gate tests (no server)
        timeout-minutes: 2
        run: python3 -I scripts/bench/test_mixed_checks.py
      # A suite without PostgreSQL 19 must not care about port 5433. Only
      # the regression check asks for this (input occupy_5433, quick compare):
      # no other run binds or looks at the port. The process holds the port
      # during the setup; the step after the setup checks that same process
      # and stops it.
      - name: Fixture, hold port 5433 during the setup (regression check only)
        if: github.event_name == 'workflow_dispatch' && inputs.occupy_5433
        env:
          FIXTURE_MODE: ${{ inputs.mode }}
          FIXTURE_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [[ $FIXTURE_MODE != quick || $FIXTURE_SUITE != compare ]]; then
            echo "occupy_5433 is for mode quick, suite compare only" >&2; exit 1
          fi
          ready="$RUNNER_TEMP/fixture-5433.ready"
          rm -f "$ready"
          nohup python3 -I -c 'import socket, sys, time
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 5433)); s.listen()
          open(sys.argv[1], "w").close(); time.sleep(900)' "$ready" >/dev/null 2>&1 &
          pid=$!
          echo "$pid" > "$RUNNER_TEMP/fixture-5433.pid"
          # The file is written by the process itself, after its listen().
          for _ in $(seq 50); do [[ -e $ready ]] && break; sleep 0.2; done
          if [[ ! -e $ready ]] || ! kill -0 "$pid"; then
            echo "the fixture process did not get port 5433" >&2; exit 1
          fi
          echo "fixture: process $pid listens on 127.0.0.1:5433"
      - name: PostgreSQL 18.7 (and 19 for the pg19 suite), pgbouncer, Varnish, HAProxy and the reference Alerta environment
        timeout-minutes: 15
        env:
          # The same selection as the Benchmark step: PostgreSQL 19 is
          # installed and started for pg19 and all only.
          BENCH_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}
        run: scripts/bench/setup.sh
      - name: Fixture, the same process held port 5433 through the setup; stop it
        if: github.event_name == 'workflow_dispatch' && inputs.occupy_5433
        run: |
          set -euo pipefail
          pid=$(cat "$RUNNER_TEMP/fixture-5433.pid")
          kill -0 "$pid" || { echo "the fixture process $pid ended before the setup did" >&2; exit 1; }
          echo "fixture: process $pid held 127.0.0.1:5433 through the setup"
          kill "$pid"
          for _ in $(seq 50); do kill -0 "$pid" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$pid" 2>/dev/null; then echo "the fixture process $pid did not stop" >&2; exit 1; fi
          echo "fixture: process $pid stopped"
      - name: Benchmark
        # The tuning suite has six arms: about 45 minutes in full mode. The
        # pg19 suite has three arms on two versions: about 50 minutes. The
        # fastpath suite has five arms: about 40 minutes. The pgtune suite has
        # four arms: about 35 minutes at 100,000 alerts (an estimate).
        timeout-minutes: 70
        env:
          BENCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'quick' }}
          # A pull request checks the plumbing of every suite.
          BENCH_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}
          # A pull request runs the pgtune suite's 100,000-alert path.
          PGTUNE_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.pgtune_rows || '100000' }}
        run: |
          set -euo pipefail
          echo "BENCH_OUT=$RUNNER_TEMP/bench-out" >> "$GITHUB_ENV"
          status=0
          python3 -I scripts/bench/bench_compare.py "$RUNNER_TEMP/bench-out" || status=$?
          if [ -f "$RUNNER_TEMP/bench-out/summary.md" ]; then
            cat "$RUNNER_TEMP/bench-out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Collect environment records
        if: always() && env.BENCH_OUT != ''
        run: |
          cp "$BENCH_WORK/alerta-pip-freeze.txt" "$BENCH_OUT/" 2>/dev/null || true
          cp "$BENCH_WORK/pg.log" "$BENCH_OUT/postgres.log" 2>/dev/null || true
          cp "$BENCH_WORK/pg19.log" "$BENCH_OUT/postgres19.log" 2>/dev/null || true
          cp "$BENCH_WORK/pgb/pgbouncer.log" "$BENCH_OUT/" 2>/dev/null || true
          nproc > "$BENCH_OUT/nproc.txt"; free -m > "$BENCH_OUT/free.txt"
      - name: Upload results (7-day artifact)
        if: always() && env.BENCH_OUT != ''
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bench-compare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCH_OUT }}
          retention-days: 7

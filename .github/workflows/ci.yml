name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  openapi:
    name: OpenAPI structure
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: .github/openapi/package-lock.json
      - name: Install OpenAPI validator
        run: npm ci --ignore-scripts --prefix .github/openapi
      - name: Validate OpenAPI
        run: >-
          .github/openapi/node_modules/.bin/redocly
          lint spec/openapi.yaml
          --config redocly.yaml
          --format github-actions

  reference-guard:
    name: reference/ is read-only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Reference policy (ADR-0001)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          .github/scripts/reference-guard.sh HEAD "$base"
      - name: Guard regression cases
        run: .github/scripts/test-reference-guard.sh

  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alrust
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alrust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  conformance-reference:
    name: conformance vs reference alerta
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alerta
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot reference server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/alerta
        run: conformance/scripts/run-reference.sh
      - name: Smoke check
        run: curl -fsS http://127.0.0.1:8080/management/healthcheck
      # Phase 0: the black-box suite runs here against ALRUST_TARGET=http://127.0.0.1:8080
      # once conformance/ has one (language pending ADR-0002).

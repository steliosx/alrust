name: Forgehold conformance unit tests (Python 3.12)

# Forgehold lane profile, phase 2 (FH-ALRUST-CONF-UNIT-1): the ci.yml
# conformance-unit job, run inside one Forgehold micro-VM. Same checkout
# shape, setup-python pin, hashed wheel-only lock and pytest command as
# ci.yml; no PostgreSQL, no reference server, no build. Each stage's RQ_JSON
# line comes from forgehold-stage.sh after the command succeeds. Measured on
# one pinned CPU of the lane's host: lock install about 30 s, tests about
# 175 s, so the whole job should take about 4 minutes of its 6.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forgehold-conformance-unit:
    name: forgehold-conformance-unit
    runs-on: [self-hosted, Linux, X64, forgehold]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          submodules: false
          persist-credentials: false
      - name: Bind the checkout to the dispatched commit (GITHUB_SHA must equal HEAD)
        run: .github/scripts/forgehold-bind.sh forgehold-conformance-unit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node24)
        with:
          python-version: "3.12"
      - name: Locked test environment
        run: .github/scripts/forgehold-stage.sh forgehold-conformance-unit locked-env .github/scripts/conformance-unit.sh install
      - name: Unit tests
        run: .github/scripts/forgehold-stage.sh forgehold-conformance-unit unit-tests .github/scripts/conformance-unit.sh test

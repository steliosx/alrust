name: Forgehold conformance unit tests, shard entry-supervisor (Python 3.12)

# Forgehold lane profile, phase 2 (FH-ALRUST-CONF-UNIT-1): one of the shards
# of ci.yml's conformance-unit job, run inside one Forgehold micro-VM. Same
# checkout shape, setup-python pin, hashed wheel-only lock and pytest command
# as ci.yml, through .github/scripts/conformance-unit.sh, which defines the
# shards; together they are exactly conformance/tests/unit. No PostgreSQL, no
# reference server, no build. Each stage's RQ_JSON line comes from
# forgehold-stage.sh after the command succeeds. The job timeout is 5 minutes;
# the script bounds the pip install (90 s) and the tests (240 s). Checkout,
# setup-python and venv creation have no extra bound, and whether the whole
# job fits the lane's episode budget is for that lane to qualify.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forgehold-cu-entry-supervisor:
    name: forgehold-cu-entry-supervisor
    runs-on: [self-hosted, Linux, X64, forgehold]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          submodules: false
          persist-credentials: false
      - name: Bind the checkout to the dispatched commit (GITHUB_SHA must equal HEAD)
        run: .github/scripts/forgehold-bind.sh forgehold-cu-entry-supervisor
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node24)
        with:
          python-version: "3.12"
      - name: Locked test environment
        run: .github/scripts/forgehold-stage.sh forgehold-cu-entry-supervisor locked-env .github/scripts/conformance-unit.sh install
      - name: Unit tests (entry-supervisor)
        run: .github/scripts/forgehold-stage.sh forgehold-cu-entry-supervisor unit-tests .github/scripts/conformance-unit.sh test entry-supervisor

# Search and alert-list measurement (docs/performance/search-v2.md):
# crates/alrust-store-pg/tests/search_measure.rs, which `cargo test` ignores.
# Hosted runner, throwaway PostgreSQL 18.6 cluster, synthetic data only; the
# numbers are relative and the plans are shapes, not a performance claim.
# Not a required check.
name: search measurement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/alrust-store-pg/tests/search_measure.rs
      - .github/workflows/search-measure.yml

permissions:
  contents: read

concurrency:
  group: search-measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: search measurement (PostgreSQL 18.6, relative numbers only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/alrust
      ALRUST_MEASURE_ROWS: "10000,100000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          # The store applies the pinned reference schema.sql (ADR-0005).
          submodules: true
          persist-credentials: false
      - name: PostgreSQL 18.6 (PGDG apt, no container registry)
        timeout-minutes: 5
        run: .github/scripts/start-postgres18.sh alrust
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master resolved 2026-11-06
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 resolved 2026-11-06
      - name: Measure
        timeout-minutes: 30
        env:
          ALRUST_MEASURE_OUT: ${{ runner.temp }}/search-measure
        run: |
          echo "MEASURE_OUT=$ALRUST_MEASURE_OUT" >> "$GITHUB_ENV"
          status=0
          cargo test --locked -p alrust-store-pg --test search_measure -- --ignored --nocapture --test-threads=1 || status=$?
          if [ -f "$ALRUST_MEASURE_OUT/summary.md" ]; then
            cat "$ALRUST_MEASURE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload the summary and plans (7-day artifact)
        if: always() && env.MEASURE_OUT != ''
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: search-measure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MEASURE_OUT }}
          retention-days: 7
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: false
      - name: Stop PostgreSQL 18.6
        if: always()
        timeout-minutes: 2
        run: .github/scripts/stop-postgres18.sh

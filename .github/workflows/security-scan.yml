name: security scan

# Not a required check. Scans the Rust dependencies, the Python lock files
# and the workflows themselves. Runs weekly and on changes to these files.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - conformance/requirements.lock
      - .github/reference-requirements.lock
      - .github/reference-build.lock
      - scripts/bench/gunicorn.lock
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  # A newer run for the same ref replaces the older one that is still pending.
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          submodules: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master resolved 2026-11-06
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 resolved 2026-11-06
      - name: Install cargo-deny 0.20.2
        run: |
          set -euo pipefail
          cargo install --locked --version 0.20.2 cargo-deny
      - name: Check advisories, bans and sources
        run: |
          set -euo pipefail
          cargo deny check advisories bans sources

  pip-audit:
    name: pip-audit (Python lock files)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node24)
        with:
          python-version: "3.12"
      - name: Install pip-audit 2.10.1
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip install -q pip-audit==2.10.1
      # Every entry in these files carries a sha256 hash, so each file is
      # checked with --require-hashes. --no-deps: the files are already
      # fully pinned, so pip-audit does not resolve anything.
      - name: Audit the lock files
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/pip-audit-venv/bin/pip-audit"
          for lock in \
            conformance/requirements.lock \
            .github/reference-requirements.lock \
            .github/reference-build.lock \
            scripts/bench/gunicorn.lock
          do
            echo "::group::$lock"
            "$audit" --no-deps --require-hashes -r "$lock"
            echo "::endgroup::"
          done

  zizmor:
    name: zizmor (workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node24)
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node24)
        with:
          python-version: "3.12"
      - name: Install zizmor 1.31.1
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/python" -m pip install -q zizmor==1.31.1
      - name: Audit the workflows
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" .github/workflows/

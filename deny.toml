# cargo-deny settings. Run by .github/workflows/security-scan.yml.
# The licenses check is not run: no allow-list is written yet.

[advisories]
# A RustSec vulnerability advisory for any crate fails the check. An
# unmaintained advisory fails it only for a direct dependency of the
# workspace (the setting below); an unsound advisory likewise (the default
# of cargo-deny 0.20.2, not set here). For a crate that arrives only
# through another crate, those two kinds can pass. A yanked version fails
# the check.
unmaintained = "workspace"
yanked = "deny"
# The one accepted advisory (DECISIONS Y76, the owner, 2026-11-17). It says
# that chrono is unmaintained and reports no vulnerability; no chrono
# version clears it. This exception matches only RUSTSEC-2026-0543. Other
# advisories keep their configured handling. A separately identified
# vulnerability in the scanned chrono dependency still fails the check.
# Review on or before 2027-02-15 and at each chrono update; the entry does
# not expire by itself. Replacing chrono is a backlog item.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no vulnerability reported; accepted by the owner 2026-11-17 (DECISIONS Y76); review by 2027-02-15" },
]

[bans]
# Two versions of one crate only warn.
multiple-versions = "warn"
# The workspace crates name each other by path with no version, which
# cargo-deny counts as a wildcard; so this only warns.
wildcards = "warn"

[sources]
# Only crates.io may supply crates.
unknown-registry = "deny"
unknown-git = "deny"

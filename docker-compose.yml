# alrust alpha: the API server on PostgreSQL 18.6.
#   ALRUST_ADMIN_KEY=$(openssl rand -hex 20) docker compose up --build
# Then: curl -H "Authorization: Key $ALRUST_ADMIN_KEY" http://localhost:8080/alerts
services:
  db:
    # postgres:18.6, pinned to the index digest current on 2026-10-07.
    image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: alrust
      POSTGRES_PASSWORD: ${ALRUST_DB_PASSWORD:-alrust}
      POSTGRES_DB: alrust
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker;
      # mount the parent directory.
      - alrust-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alrust -d alrust"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  alrust:
    build: .
    image: alrust:alpha
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://alrust:${ALRUST_DB_PASSWORD:-alrust}@db:5432/alrust
      ALRUST_BASE_URL: ${ALRUST_BASE_URL:-http://localhost:8080}
      ALRUST_ADMIN_KEY: ${ALRUST_ADMIN_KEY:?set ALRUST_ADMIN_KEY to an admin API key of your choice}
      ALRUST_AUTH_REQUIRED: ${ALRUST_AUTH_REQUIRED:-true}
      ALRUST_HOUSEKEEPING_INTERVAL: ${ALRUST_HOUSEKEEPING_INTERVAL:-0}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Loopback only by default; set ALRUST_LISTEN=0.0.0.0 to expose it.
      - "${ALRUST_LISTEN:-127.0.0.1}:${ALRUST_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  alrust-pgdata:

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1474" viewBox="0 0 1200 1474" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Alrust planned architecture — no working alrust runtime yet</title>
<desc id="diagram-desc">Planned architecture for an internal NOC. Zabbix version 7.0.25 or newer uses a native webhook. Veeam ONE and other sources use a generic webhook mapper. Both feed alrust-receivers, which feeds alrust-api. The API uses axum and tokio and owns orchestration and I/O. It separately calls alrust-engine, a pure Rust library for deduplication, correlation and lifecycle with no I/O, and reads and writes alrust-store-pg, using SQLx and PostgreSQL only. There is no engine-to-store edge. The vendored Alerta web UI calls the API using the consumed Alerta HTTP contract. Tauri on Windows and macOS wraps the same UI and receives API SSE for native notifications. The API also sends outbound webhooks to notification targets. Customer grouping and routing are not a tenant security boundary. All components and flows shown are planned.</desc>

# Optional second configuration file for the disposable benchmark.
# App readiness comes from the existing site frontend. Role readiness comes
# from the same Patroni monitors as the local PgBouncer writer frontend.
frontend preferred_alerta_api
    mode http
    bind "${AFFINITY_BIND}"
    acl writer_a str(postgres_primary/site_a),srv_is_up -m bool
    acl writer_b str(postgres_primary/site_b),srv_is_up -m bool
    acl app_a nbsrv(alerta_at_a) gt 0
    acl app_b nbsrv(alerta_at_b) gt 0
    http-request return status 503 if writer_a writer_b
    http-request return status 503 unless writer_a or writer_b
    use_backend alerta_at_a if writer_a app_a
    use_backend alerta_at_b if writer_b app_b
    use_backend alerta_at_a if app_a
    default_backend alerta_at_b

backend alerta_at_a
    mode http
    http-response set-header X-Alrust-Bench-Site a
    option httpchk
    http-check send meth GET uri /_bench_site_ready ver HTTP/1.1 hdr Host alerta
    http-check expect status 200
    server frontend "${SITE_A_HTTP}" check inter 500ms fall 2 rise 2 init-state fully-down

backend alerta_at_b
    mode http
    http-response set-header X-Alrust-Bench-Site b
    option httpchk
    http-check send meth GET uri /_bench_site_ready ver HTTP/1.1 hdr Host alerta
    http-check expect status 200
    server frontend "${SITE_B_HTTP}" check inter 500ms fall 2 rise 2 init-state fully-down

# Start a copy in each data site with the local Alerta addresses and the same
# PostgreSQL/Patroni endpoints. This configuration is for a disposable lab.
global
    nbthread 1
    presetenv ALERTA_CHECK_INTER 500ms
    presetenv ALERTA_CHECK_TIMEOUT 2s
    presetenv WRITER_IDLE_TIMEOUT 30s
    presetenv PATRONI_HOST_A 127.0.0.1
    presetenv PATRONI_HOST_B 127.0.0.1

defaults
    timeout connect 2s
    timeout check 2s
    timeout client 30s
    timeout server 30s

frontend alerta_api
    mode http
    bind "${ALERTA_BIND}"
    .if defined(ALERTA_OPERATOR_APP_SITE)
    http-response set-header X-Alrust-Bench-App-Site "${ALERTA_OPERATOR_APP_SITE}"
    .endif
    monitor-uri /_bench_site_ready
    monitor fail if { nbsrv(alerta_local) lt 1 }
    .if defined(ALERTA_LAB_DASHBOARD_ENCODING)
    use_backend alerta_dashboard if METH_GET { path /alerts }
    .endif
    default_backend alerta_local

backend alerta_local
    mode http
    balance roundrobin
    http-response set-header X-Alrust-Bench-Worker %[srv_name]
    timeout check "${ALERTA_CHECK_TIMEOUT}"
    option httpchk
    http-check send meth GET uri /management/gtg ver HTTP/1.1 hdr Host alerta
    http-check expect status 200
    default-server inter "${ALERTA_CHECK_INTER}" fall 2 rise 2 init-state fully-down
    server vm1 "${ALERTA_VM_1}" check
    server vm2 "${ALERTA_VM_2}" check

.if defined(ALERTA_LAB_DASHBOARD_ENCODING)
# Only synthetic dashboard list reads negotiate compression. Track the
# ordinary app health checks so this arm does not add probes to Alerta.
backend alerta_dashboard
    mode http
    balance roundrobin
    filter comp-res
    compression algo-res gzip
    compression type-res application/json
    http-response set-header X-Alrust-Bench-Worker %[srv_name]
    http-response add-header Vary Accept-Encoding unless { res.hdr(Vary) -i Accept-Encoding * }
    server vm1 "${ALERTA_VM_1}" track alerta_local/vm1
    server vm2 "${ALERTA_VM_2}" track alerta_local/vm2
.endif

frontend postgres_writer
    mode tcp
    bind "${WRITER_BIND}"
    timeout client "${WRITER_IDLE_TIMEOUT}"
    default_backend postgres_primary

backend postgres_primary
    mode tcp
    timeout server "${WRITER_IDLE_TIMEOUT}"
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
    http-check expect status 200
    default-server inter 500ms fall 2 rise 2 init-state fully-down on-marked-down shutdown-sessions
    server site_a "${POSTGRES_A}" check addr "${PATRONI_HOST_A}" port "${PATRONI_PORT_A}"
    server site_b "${POSTGRES_B}" check addr "${PATRONI_HOST_B}" port "${PATRONI_PORT_B}"

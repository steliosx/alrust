        object or string gives no alerts, so 201 `{status: ok, ids: []}`;
        `null`, a number or a boolean is not iterable (TypeError, so 500); a
        non-empty string or object iterates characters or keys, whose missing
        `.get` gives 400.

        Per alert (`parse_prometheus`, `:16-101`), in order:
        1. `status` defaults to `firing`.
        2. Every label value `v` becomes `v.format(**labels)` (original
           labels); every annotation value becomes `v.format(**expanded
           labels)`. Any exception keeps the raw value, so non-strings and
           invalid formats pass through unchanged. Format specifications are
           payload-controlled (WP-SEC-1, source-level, Codex-confirmed with
           qualifiers: a large width allocates a large string; the pinned
           settings set no `MAX_CONTENT_LENGTH`, and deployment limits are
           not verified). No stress test was run.
        3. A truthy `annotations.alertname` replaces `labels.alertname`.
        4. `severity`: `firing` pops `labels.severity` (default `warning`);
           `resolved` uses the alarm model's normal severity
           (`DEFAULT_NORMAL_SEVERITY`, else `normal` for ALERTA or `OK` for
           ISA_18_2) and leaves any `severity` label in place, so it becomes
           a tag; any other status gives `unknown`. `warning` and `unknown`
           are ALERTA-model names; ISA_18_2's severity map has neither (its
           unknown is `Unknown`), and what processing then does is NOT
           established.

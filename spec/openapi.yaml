        `alert-rate-limited`, `alert-heartbeat`, `alert-blackout`,
        `webhook-received`), which is connected only when `AUDIT_TRAIL`
        includes `write` (default `['admin']`) and `AUDIT_LOG` or
        `AUDIT_URL` is set (`utils/audit.py:27-46`).


            else 3 when service is set; else 4 for event without resource;
            else 5 for group; else 6 for resource and event; else 7 for tags.
            **Any origin makes it 8**, overriding the rest.
        environment: {type: string}
        service: {type: array, items: {type: string}}
        resource: {type: [string, "null"]}
        event: {type: [string, "null"]}
        group: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        origin: {type: [string, "null"]}
        customer: {type: [string, "null"]}
        startTime: {type: string}
        endTime: {type: string}
        duration: {type: integer, description: "recomputed; can be negative if endTime precedes startTime"}
        status: {enum: [pending, active, expired]}
        remaining: {type: [integer, string], description: "integer on create; a numeric string (seconds, possibly fractional) on reads, list and updates"}
        user: {type: [string, "null"]}
        createTime: {type: string}
        text: {type: [string, "null"]}
    BlackoutInput:
      type: object
      x-source: alerta/models/blackout.py:25-48, :92-114
      additionalProperties: true
      required: [environment]

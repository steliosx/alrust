           `instance`; `n/a` only when `instance` is absent, so a present
           but empty or null `instance` stays `''` or null (WP-R3). A truthy
           `exported_instance` leaves `instance` as a tag.
        6. `event` = popped `event` if truthy, else popped `alertname`; with
           neither, KeyError gives 400 `'alertname'`.
        7. `environment` = popped `environment`, default config
           `DEFAULT_ENVIRONMENT` (`Production`); the reject plugin then
           applies `ALLOWED_ENVIRONMENTS` as for `/alert` (403).
        8. `customer` = popped `customer`, then `assign_customer` in the
           dispatcher.
        9. `correlate` = popped `correlate` split on `,`, else null.
        10. `service` = popped `service` split on `,`; absent gives `['']`
            (one empty string), not `[]`.
        11. `group` = popped `group` if truthy, else popped `job`;
            `Prometheus` only when `job` is absent, so a present but empty or
            null `job` stays `''` or null (WP-R3).
        12. `origin` = `prometheus/` + popped `monitor` (default `-`); a

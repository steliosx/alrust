      parameters:
        - {name: status, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "repeatable and arbitrary. `ok`, `slow` and `expired` each add an OR branch in SQL; any other value is ignored, so `status=foo` alone applies no status predicate (pg.py:886-908)"}
        - {name: page, in: query, schema: {type: integer, default: 1}, description: "out of range gives 416 (paging.py:15-16)"}
        - {name: page-size, in: query, schema: {type: integer}, description: "default DEFAULT_PAGE_SIZE (50); `limit` is the deprecated alias (paging.py:19-25)"}
        - {name: sort-by, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "one of origin, tags, attributes, attributes.<k>, type, createTime, timeout, receiveTime, customer, latency, since; a `-` prefix reverses it. Anything else gives 400 (pg/utils.py:28-49, :273-288)"}
        - name: filters
          in: query
          style: form
          explode: true
          schema: {type: object, additionalProperties: {type: string}}
          description: |
            The accepted filter names are `origin`, `tag`, `attributes`,
            `attributes.<k>`, `type`, `createTime`, `timeout`, `receiveTime`,
            `customer`, `latency` and `since` (`pg/utils.py:55-104`,
            `:273-288`). Excluded names are **silently ignored**: `id` and
            the paging, sort and credential parameters (`EXCLUDE_FROM_QUERY`,
            `:19-22`). Any other name gives 400 `Invalid filter parameter`.

            **Generic path** (every name except `attributes.<k>`):
            - a single value means equality; `~v` means ILIKE `%v%`; a `!`
              suffix negates;
            - several values mean `= ANY(...)`, or a regex when any value
              starts with `~`.

            **`attributes.<k>=v`** (`:69-72`) always becomes
            `attributes @> {k: <first value>}`:
            - extra values are ignored, and `~` is taken literally;
            - a trailing `!` becomes **part of the key name**; it does not
              negate.

            **Potential SQL failures (inferred from source, NOT verified;
            no universal 500 is claimed):**
            - `tag=v` compares the `tags` text[] column with a text
              parameter. PostgreSQL parses array-literal text such as
              `{a,b}` as an array, so such values may succeed; other values
              are potential malformed-literal errors (500). Valid-literal
              behavior is NOT_RUN.
            - Plain `attributes=v` compares the jsonb column with a text
              parameter. JSON-formatted text may be accepted as jsonb;
              non-JSON text is a potential input error (500). NOT_RUN.

            **Missing-name hypotheses** (independent of the value; NOT
            verified):
            - `type` maps to column `event_type`, but the table's column is
              `type` (`sql/schema.sql:109-118`, `pg/utils.py:280`). A
              missing-column error (500) is inferred for any value; it would
              also break `sort-by=type`.
            - `latency` and `since` are SELECT-list aliases, not columns.
              That a WHERE clause cannot reference them is a hypothesis.
      responses:
        "200":
          description: A page, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [status, page, pageSize, pages, more, heartbeats, total]
                properties:
                  status: {const: ok}
                  page: {type: integer}
                  pageSize: {type: integer}
                  pages: {type: integer}
                  more: {type: boolean}
                  heartbeats: {type: array, items: {$ref: '#/components/schemas/Heartbeat'}}
                  total: {type: integer}
                  message: {const: not found, description: "present only when the page is empty"}
        "400": {description: "invalid filter or sort parameter", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "416": {description: "page out of range", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}

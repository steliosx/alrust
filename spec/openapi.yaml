      operationId: updateAlertNote
      x-source: alerta/views/alerts.py:666-698; alerta/database/backends/postgres/base.py:1411-1428
      x-scope: write:alerts
      description: |
        **Note lookups are not scoped to the path alert or the caller's
        customers** (planned customer-mapping C21). The path alert is looked
        up with the usual customer filter (404 when not visible), but the
        note is then found by `Note.find_by_id(note_id)`, which is
        `WHERE id = <note_id>` with no alert or customer predicate
        (`postgres/base.py:1381-1386`). A caller who can see some alert,
        knows a note id and reaches this handler can therefore act on that
        note, including another customer's. Credentialed keys or users with
        only read scopes fail the `write:alerts` check. Callers without
        credentials reach the handler under the policy branches that skip
        the scope check (credential precedence 3 and 4, and 5 with
        unestablished handler outcome), including `ALLOW_READONLY`.
        Source-derived, NOT verified. alrust behavior here is an owner
        decision.
        - An empty or missing body gives 400 `nothing to change`.
        - The whole request object is passed on as keyword arguments,
          `note.update(**update)` then `db.update_note(note.id, **kwargs)`
          (`views/alerts.py:685-693`, `models/note.py:136-137`), with `user`
          forced to the caller's login and `text` replaced by
          `process_note`'s result. The audit event is sent first.
        - **Reserved keys:** a body key `id` collides with
          `update_note`'s positional `id`, and `self` with the bound
          method, raising TypeError before the note update SQL (the
          alert and note lookups have already run), which the generic
          handler maps to 500. Codex's body probe with an inert backend
          confirmed zero update calls for `id`. With the default plugins
          (no `take_note`) nothing is written; a custom note plugin may
          already have acted. A **falsy** body (`null`, `[]`, `0`, `false`,
          `""`, `{}`) gives 400 `nothing to change` first. A **truthy**
          non-object body (a non-empty list, string, number or `true`)
          passes that check and fails with TypeError at
          `update['user'] = ...`, giving 500. Codex's body probe covered
          eleven ordinary bodies; HTTP NOT_RUN.
        - Otherwise only `text` (when not null), `attributes` (when not
          null) and `user` (`COALESCE(login, user)`) are written, and
          `update_time` becomes the database's UTC now. Other ordinary keys
          are ignored.
        - `attributes` is not type-checked. Any non-null value reaches
          `attributes || <value>`. Dicts are sent as JSON; other types use
          the driver's default adaptation, and PostgreSQL's jsonb `||`
          accepts objects, arrays and scalars. Whether a given non-object
          value is accepted, what is stored, and whether the following
          `dict(rec.attributes)` conversion of a stored non-object fails
          are **NOT established** (SQL/HTTP NOT_RUN). `_updateone` commits
          before that conversion, so a later 500 does not mean nothing was
          written.

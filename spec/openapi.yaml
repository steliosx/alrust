        email: {type: string, description: "truthy"}
        provider: {type: string, description: "truthy; basic, ldap, saml2, github, cas, or the AUTH_PROVIDER value for OIDC"}
        orgs: {type: array, items: {type: string}, description: "truthy; GitHub only"}
        groups: {type: array, items: {type: string}, description: "truthy"}
        roles: {type: array, items: {type: string}, description: "truthy"}
        scope: {type: string, description: "truthy; the scopes joined with single spaces (models/token.py:104-105)"}
        email_verified: {description: "omitted only when null; OIDC may carry a non-boolean value"}

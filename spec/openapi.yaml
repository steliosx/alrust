  /auth/saml:
    description: |
      Registered only when `AUTH_PROVIDER` is `saml2`, which also needs
      pysaml2 at startup (`auth/__init__.py:19-25`); under any other
      provider these paths and `/auth/saml/metadata.xml` do not exist (404).
      Library behavior below is from pysaml2 7.5.0 (pinned in the reference
      repository's `requirements-ci.txt:2`),
      read from its published wheel; nothing was run.

      **SP configuration** (`get_saml2_config`, `saml.py:21-55`), rebuilt on
      **every** request to any SAML route:
      - `metadata.remote` = `[{url: SAML2_METADATA_URL}]` (default null,
        `settings.py:161`), replaced wholesale by `SAML2_CONFIG['metadata']`
        when that is set (`:48-49`);
      - `entityid` = `absolute_url()` (`BASE_URL`, else the request's
        `url_root`, so Host-dependent), replaced by `SAML2_ENTITY_ID` when
        set (default null, `settings.py:160`);
      - one assertion consumer service, `absolute_url('/auth/saml')`, HTTP-POST
        binding;
      - `allow_unsolicited: True`, `authn_requests_signed: False`,
        `want_assertions_signed: True`, `want_response_signed: False`
        (`:38-41`);
      - then `SAML2_CONFIG` (default `{}`, `settings.py:164`) is deep-merged
        over all of this (`utils/collections.py:1-12`), so it can override
        any of the above; `allow_unknown_attributes` is forced true
        (`:54`).
      pysaml2 loads metadata while loading this configuration (pysaml2
      `config.py:280`, `:338`, `:265-273`, `:369-390`); a `remote` entry is fetched by HTTP GET
      (`mdstore.py:862-873`), so the IdP metadata is inferred to be
      re-fetched on every SAML request (NOT_RUN). The remote entry carries
      no `cert`, so pysaml2 does not check a metadata signature
      (`mdstore.py:731-732`); trust in the IdP's signing keys rests on how
      `SAML2_METADATA_URL` is fetched.
    get:
      operationId: authSamlRedirect
      x-source: alerta/auth/saml.py:21-67
      x-scope: none
      summary: Start SP-initiated SAML login (redirect to the IdP)
      security: [{}]
      description: |
        No permission decorator and no `cross_origin`; a GET, so no
        Content-Type check.
        1. `prepare_for_authenticate(relay_state=request.referrer)`
           (`saml.py:66`). pysaml2's default request binding is HTTP-Redirect
           (`client.py:39-43`). The IdP is the only one in the metadata; zero
           or several IdPs raise IdpUnspecified (`client_base.py:209-230`),
           which is uncaught (generic 500). The AuthnRequest is unsigned
           unless `SAML2_CONFIG` overrides `authn_requests_signed`.
        2. 302 with the headers pysaml2 returns (`saml.py:67`), expected to be
           a `Location` to the IdP's single-sign-on URL carrying the request
           and the relay state. The exact header set is NOT established.
        3. **RelayState** is the request's `Referer`. With no `Referer` it is
           `None`; what pysaml2 then puts in the redirect is NOT
           established.
        4. The request id is discarded: no outstanding-request state is kept,
           so the POST below cannot match `InResponseTo` (see
           AUTH-SEC-9).

        Source-derived; runtime NOT_RUN.
      responses:
        "302":
          description: "Redirect to the IdP"
          headers:
            Location: {schema: {type: string}}
        "500": {description: "metadata load failure, IdP selection failure, or other pysaml2 error (generic handler)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
      x-runtime: "NOT_RUN"
    post:
      operationId: authSamlAcs
      x-source: alerta/auth/saml.py:70-118; alerta/templates/auth/saml2.html:1-14; alerta/auth/__init__.py:44-54
      x-scope: none
      summary: SAML assertion consumer service; delivers the token to the opener window by postMessage
      security: [{}]
      description: |
        No permission decorator; `OPTIONS` via
        `cross_origin(supports_credentials=True)`.
        1. Content-Type (`auth/__init__.py:47-54`): the JSON check is skipped
           only when the header is **exactly**
           `application/x-www-form-urlencoded`; a `; charset=...` suffix
           falls through to 415. If the WSGI environ has no `CONTENT_TYPE` key,
           the header lookup itself raises a plain KeyError (werkzeug 3.1.7
           `datastructures/headers.py:627-639` indexes the environ directly),
           so a generic 500 (`exceptions.py:80`, `:120-136`); a present but
           empty Content-Type reaches the 415. Whether a WSGI server omits
           the key is NOT_RUN. A JSON
           Content-Type passes the check, and then step 2 fails (400).
        2. `RelayState` and `SAMLResponse` are read from the form
           (`saml.py:73`, `:76`); a missing one is a BadRequestKeyError
           (`datastructures/structures.py:226-238`), so 400.
        3. `parse_authn_request_response(SAMLResponse, HTTP-POST)` with no
           outstanding requests (`saml.py:75-78`; pysaml2
           `client_base.py:759-811`). It returns None for an empty response,
           an undecodable one (UnravelError) or a non-AuthnResponse; the next
           line then raises AttributeError (generic 500). StatusError and
           other parse or verification errors propagate (generic 500).
           Unsolicited responses are accepted: with no matching outstanding
           query, pysaml2 passes when `allow_unsolicited` is set, next to its
           own comment "Should check that I haven't seen this before"
           (`response.py:541-543`, `:703-704`). How pysaml2 enforces
           `want_assertions_signed`, audience and time conditions was not
           traced: NOT established.
           **SECURITY AUTH-SEC-9 (unsolicited and unbound responses):**
           unsolicited (IdP-initiated) responses are enabled and the GET
           keeps no request state, so no response is tied to a request this
           server issued, and no replay cache is applied at this point.
           Class: login CSRF and assertion replay within the assertion's
           validity window. Source-derived, NOT_RUN.
        4. Mapping (`saml.py:79-84`): `identity` = `get_identity()`, a dict
           of attribute name to value list built from every assertion's
           attribute statements, including statements inside `Advice`
           assertions (`response.py:657-679`); names are as pysaml2's
           attribute converters render them (NOT established).
           `name` = `SAML2_USER_NAME_FORMAT` (default `{givenName}
           {surname}`, `settings.py:162`) formatted with the first value of
           every attribute; a missing referenced attribute raises KeyError
           (generic 500). `login` = the subject NameID text. `email` = first
           value of `SAML2_EMAIL_ATTRIBUTE` (default `emailAddress`,
           `settings.py:163`); absent: KeyError, generic 500.
        5. Local user (`:87-94`): `find_by_username(email)`, which matches
           `login` OR `email` (`postgres/base.py:1051-1053`). Not found: a
           new `User(name, login=NameID, password '', email,
           roles=USER_ROLES, text 'SAML2 user', email_verified=True)`; an
           insert failure is **swallowed** (an `ApiError` is built and not
           raised, `:91-94`), so the flow continues with the unsaved object
           and can still issue a token. Found: nothing is updated (name,
           NameID and roles stay as stored).
        6. `status` other than `active`: `ApiError` 403 `User <email> is not
           active`, a **JSON** error, not the HTML page, so the opener
           receives no message (`:96-97`).
        7. `groups` = `identity['groups']`, a fixed attribute name, default
           `[]` (`:99`). `not_authorized('ALLOWED_SAML2_GROUPS', groups)`
           (default `['*']`, `settings.py:165`) or
           `not_authorized('ALLOWED_EMAIL_DOMAINS', [user.domain])`: 403
           **HTML** page posting `{status: error, message: 'User <email> is
           not authorized'}` (`:100-102`). Both are no-ops while
           `AUTH_REQUIRED` is false.
        8. Last login; `scopes` = `Permission.lookup(user.email,
           roles=user.roles + groups)`; `customers` =
           `get_customers(user.email, groups + ([user.domain] if user.domain
           else []))` (NoCustomerMatch: JSON 403); audit event `saml2-login`
           (`:104-111`).
        9. Token (`:113-115`): `sub` = the local user id, provider `saml2`,
           `preferred_username` = `user.email`, roles `user.roles`, groups
           the SAML `groups` values, `email_verified` as stored.
        10. 200 `text/html` from `templates/auth/saml2.html`: a script that
            runs `window.opener.postMessage(<message as JSON>, '<origin>')`
            then `window.close()`, where the message is `{status: ok,
            token}` and `<origin>` is the posted `RelayState` (`:117-118`;
            template `:7`). Flask autoescapes `.html` templates
            (`flask/sansio/app.py:545-547`), so a quote in `RelayState`
            cannot end the JavaScript string; whether any other character
            can break the script is NOT established. Opened without an
            opener window, the script fails and the token stays in the page.
            **SECURITY AUTH-SEC-8 (token sent to a request-chosen origin):**
            the `postMessage` target origin is the unvalidated `RelayState`
            (seeded from the GET's `Referer`, but supplied by whoever builds
            the IdP request, and `*` matches any origin). No allowlist
            exists, so the Bearer token can be delivered to whichever origin
            opened the login window. Source-derived, NOT_RUN.

        Source-derived; runtime NOT_RUN.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              properties:
                SAMLResponse: {type: string, description: "base64 SAML Response (HTTP-POST binding)"}
                RelayState: {type: string, description: "used verbatim as the postMessage target origin"}
      responses:
        "200": {description: "HTML page that posts `{status: ok, token}` to window.opener", content: {text/html: {schema: {type: string}}}}
        "400": {description: "missing form member (werkzeug BadRequestKeyError)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "403":
          description: "HTML page posting `{status: error, message: 'User <email> is not authorized'}`; or JSON `User <email> is not active` or NoCustomerMatch text"
          content:
            text/html: {schema: {type: string}}
            application/json: {schema: {$ref: '#/components/schemas/Error'}}
        "415": {$ref: '#/components/responses/AuthUnsupportedMediaType'}
        "500": {description: "unparseable or rejected SAML response, missing attributes, other pysaml2 errors, or (inferred) no CONTENT_TYPE key in the WSGI environ (generic handler)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
      x-runtime: "NOT_RUN"

      x-scope: read:alerts
      description: |
        **The environment list is not filtered** (`base.py:639`): the
        page of names comes from `SELECT DISTINCT environment FROM alerts`
        over **all** alerts, ignoring the filters and the customer scope.
        Only the per-environment counts use the filtered query, so a
        customer-scoped caller also sees environment names that occur only
        in other customers' alerts (customer-mapping C20). Counts cover the
        caller's matching rows: a name with none shows zero, while a shared
        name can show a non-zero count, so no zero count is guaranteed.
        - `total` is the **filtered** `COUNT(DISTINCT environment)`, so it
          can disagree with the listed page.

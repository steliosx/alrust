  /alert/{alert_id}/note:
    parameters: [{$ref: '#/components/parameters/AlertPathId'}]
    put:
      operationId: addAlertNote
      x-source: alerta/views/alerts.py:596-633; alerta/models/alert.py:572-586; alerta/models/note.py:110-126; alerta/utils/api.py:136-166
      x-scope: write:alerts
      description: |
        Creates a note and prepends a `note` history entry to the alert.
        - Text is `request.json.get('text') or request.json.get('note')`;
          both falsy gives 400 `must supply 'note' text`.
        - `process_note` runs each plugin's `take_note`. No default plugin
          implements it, so by default it changes nothing. A plugin that
          returns an alert triggers the tag and attribute rewrite (R1.3).
        - The note stores the alert id and customer and a snapshot of
          resource, event, environment, severity and status as attributes.
        - The history entry has `id` = the **note** id and `type: note`
          (see HistoryEntry). The write uses the re-applied id prefix
          (`postgres/base.py:401-408`), as for other per-id writes.
        - **A plugin RejectException gives 500, not 400.** The rejection
          handler reads `note.id` before `note` is assigned
          (`views/alerts.py:615-619`), so it raises UnboundLocalError,
          which the generic handler maps to 500. This is reachable only with
          a rejecting note plugin (none by default). Source-derived, NOT
          verified.
        - A ForwardingLoop from a plugin gives 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string}
                note: {type: string, description: "used when text is falsy"}
      responses:
        "201":
          description: "Created. Header `Location: /alert/<alert id>/note/<note id>` (absolute)"
          content:
            application/json:
              schema:
                type: object
                required: [status, id, note]
                properties:
                  status: {const: ok}
                  id: {type: string}
                  note: {$ref: '#/components/schemas/Note'}
        "202": {description: "forwarding loop from a note plugin", content: {application/json: {schema: {$ref: '#/components/schemas/AlertIdOnly'}}}}
        "400": {description: "no note text", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "404": {description: "alert not found or not visible", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}

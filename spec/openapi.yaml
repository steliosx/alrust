        typ: {type: [string, "null"], description: "Bearer"}
        sub: {type: [string, "null"], description: "user id; for OIDC, GitHub and CAS the provider subject"}
        aud: {type: [string, "null"], description: "OAUTH2_CLIENT_ID, else SAML2_ENTITY_ID, else absolute_url() (auth/utils.py:59)"}
        exp: {type: [integer, "null"], description: "issue time + TOKEN_EXPIRE_DAYS days (default 14, settings.py:174), integer seconds"}
        nbf: {type: [integer, "null"]}
        iat: {type: [integer, "null"]}
        jti: {type: [string, "null"], description: "uuid4"}
        name: {description: "truthy; a string for basic, LDAP, SAML, GitHub and CAS, but for OIDC any truthy JSON value the provider sent (auth/oidc.py:152, :203-205; auth/utils.py:64; models/token.py:90-91)"}

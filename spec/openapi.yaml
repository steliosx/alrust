  /userinfo:
    get:
      operationId: getUserinfo
      x-source: alerta/auth/userinfo.py:14-25; alerta/models/token.py:43-115; alerta/auth/decorators.py:25-175; alerta/models/enums.py:86
      x-scope: read:userinfo
      summary: Echo the claims of the caller's Bearer token
      description: |
        `@permission(Scope.read_userinfo)` (`userinfo.py:16`;
        `models/enums.py:86`), so the credential precedence above runs first;
        a valid API key has already recorded its use (UW-R1). `OPTIONS` via
        `cross_origin()`; a GET, so no Content-Type check.
        1. The view matches `Bearer (\S+)` at the start of the
           `Authorization` header, case-sensitively (`userinfo.py:18-20`).
           No match: 401 `Missing authorization Bearer token` (`:24-25`).
           This is the outcome for every caller that passed the decorator
           without a Bearer header: an API key (`Authorization: Key`, or
           `X-API-Key` / `?api-key=` alone), Hawk (whose dispatch has no
           scope check), auth proxy, Basic, and precedence branches 3-5.
        2. `Jwt.parse(token)` (`models/token.py:43-76`) is a second,
           independent PyJWT 2.12.1 decode: algorithm HS256 only, key
           `SECRET_KEY`, signature verified, audience `OAUTH2_CLIENT_ID` or
           `SAML2_ENTITY_ID` or `absolute_url()`; `exp`, `nbf` and `iat` are
           checked when present (PyJWT defaults, `api_jwt.py:52-65`); `iss`
           is never checked (no issuer is passed, `api_jwt.py:563-564`); a
           token without `aud` fails with MissingRequiredClaimError
           (`api_jwt.py:524-527`). The view catches nothing, so **any**
           failure here is the generic 500:
           - Through the Bearer branch, the decorator has just parsed the
             same token (`auth/decorators.py:69-91`), so this parse is
             expected to succeed, except across an expiry boundary between
             the two parses (ExpiredSignatureError, then 500).
           - Through `X-API-Key` or `?api-key=` with an additional
             `Authorization: Bearer` header, the decorator never examines
             the token: a bad signature, wrong audience or expired token
             here gives 500, not 401.
           - For reference, the decorator itself maps only DecodeError
             (including its subclass InvalidSignatureError) to 401 `Token is
             invalid`, ExpiredSignatureError to 401 `Token has expired`, and
             InvalidAudienceError to 401 `Invalid audience`
             (`auth/decorators.py:75-82`). The other PyJWT InvalidTokenError
             subclasses (PyJWT `exceptions.py:15-71`) are not caught, so on
             any Bearer-authenticated route the following give the generic
             500, not 401: an `alg` other than HS256 (InvalidAlgorithmError,
             `api_jws.py:347-348`); a future `nbf` or a future `iat`
             (ImmatureSignatureError, `api_jwt.py:477-478`, `:491-492`); an
             `iat` whose `int()` conversion raises ValueError, such as
             `"1.5"` (InvalidIssuedAtError, `api_jwt.py:471-476`); a missing
             `aud` (MissingRequiredClaimError); a non-string `sub` or `jti`
             (InvalidSubjectError, InvalidJTIError, `api_jwt.py:444-445`,
             `:460-461`); and a time claim of a type `int()` rejects with
             TypeError (for example `null` or a list), which is not a PyJWT
             error at all. A ValueError on `nbf` or `exp` is raised as
             DecodeError (`api_jwt.py:486-489`, `:500-505`), so that one is
             401 `Token is invalid`. A non-string `scope` fails at
             `.split` in `Jwt.parse` (`models/token.py:71`): AttributeError,
             500.
        3. The body is `Jwt(...).serialize`, bare (no `status` wrapper), 200
           (schema UserinfoClaims). These are the **parsed and re-serialized**
           claims of whatever token passed step 2, not necessarily a token
           this server issued in the TokenClaims shape: `Jwt.parse` copies
           each value as decoded and `serialize` writes it back without
           normalizing (`models/token.py:55-75`, `:80-115`).
           - `iss`, `typ`, `sub`, `aud`, `exp`, `nbf`, `iat`, `jti` always
             (null when the claim is absent).
           - `aud` is echoed as stored: a string, or a list of strings, which
             non-strict PyJWT audience validation accepts when it contains
             the expected audience (`api_jwt.py:547-558`).
           - `exp`, `nbf`, `iat` are echoed as stored. Validation runs
             `int()` on a temporary copy and does not rewrite the payload
             (`api_jwt.py:465-505`), so accepted fractional numbers, numeric
             strings (for example `"0"`) and booleans come back unchanged.
             Tokens issued by this server carry integers.
           - `scope` round trip: parse reads the `scope` string and splits it
             on single spaces into `scopes` (`:71`); serialize joins them
             back (`:104-105`). A token without `scope` parses to `['']`,
             which is truthy, so the output then carries `scope: ""`. Such a
             token cannot pass the decorator's `read:userinfo` check itself,
             but can be echoed on the API-key path above.
           - `customers`: parse takes a legacy singular `customer` claim as
             `[customer]`, else `customers` (default `[]`) (`:74`); serialize
             emits `customers` only while `CUSTOMER_VIEWS` is on
             (`:111-112`), whatever the token holds.
           - `name`, `preferred_username`, `email`, `provider`, `orgs`,
             `groups`, `roles`, `oid` when truthy; `email_verified` and
             `picture` when not null. Any other claim in the token is
             dropped.

        Source-derived; runtime NOT_RUN.
      responses:
        "200": {description: "The token's claims, parsed and re-serialized", content: {application/json: {schema: {$ref: '#/components/schemas/UserinfoClaims'}}}}
        "401": {description: "decorator rejections (precedence above), or `Missing authorization Bearer token` from the view", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {description: "any PyJWT failure in the view's own parse, or an uncaught PyJWT error in the decorator (see step 2)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
      x-runtime: "NOT_RUN"
  /auth/openid:
    post:
      operationId: authOpenid
      x-source: alerta/auth/oidc.py:20-206; alerta/auth/__init__.py:27-33, :41, :44-54; alerta/settings.py:98-157; alerta/utils/config.py:49-71
      x-scope: none
      summary: OpenID Connect authorization-code login (generic issuer; one handler for all OIDC routes)
      security: [{}]
      description: &oidcLogin |
        One handler, `openid()`, serves `/auth/openid`, `/auth/azure`,
        `/auth/gitlab`, `/auth/google` and `/auth/keycloak`
        (`oidc.py:61-67`). **No behavior depends on the path used**: the
        issuer, and the `provider` claim, come from `AUTH_PROVIDER`, so
        posting to `/auth/google` while `AUTH_PROVIDER` is `keycloak` runs the
        Keycloak flow. There is no `/auth/cognito` route; Cognito uses any of
        these paths. The module is always imported (`auth/__init__.py:41`),
        so the routes exist under every `AUTH_PROVIDER`; with a provider
        that has no fixed issuer (for example the default `basic`), the flow
        runs whenever `OIDC_ISSUER_URL` is set, with `provider` = that
        `AUTH_PROVIDER` value. No permission decorator; `OPTIONS` via
        `cross_origin(supports_credentials=True)`; the JSON Content-Type
        check applies (415).

        **Startup** (`auth/__init__.py:27-33`): for `AUTH_PROVIDER` in
        `openid`, `azure`, `cognito`, `gitlab`, `keycloak` (not `google`),
        discovery runs once at blueprint registration to set `OIDC_AUTH_URL`
        and `OIDC_LOGOUT_URL`; any failure aborts startup (RuntimeError).

        **Per request**, in order:
        1. Discovery (`get_oidc_configuration`, `oidc.py:20-58`) runs on
           **every** request. Issuer URL by `AUTH_PROVIDER` (`:22-30`):
           - `azure`: `https://login.microsoftonline.com/<AZURE_TENANT>/v2.0`
             (default tenant `common`, `settings.py:141`);
           - `cognito`:
             `https://cognito-idp.<AWS_REGION>.amazonaws.com/<COGNITO_USER_POOL_ID>`
             (defaults `us-east-1` and null, `settings.py:103-104`);
           - `gitlab`: `GITLAB_URL` (default `https://gitlab.com`,
             `settings.py:114`);
           - `google`: `https://accounts.google.com`;
           - `keycloak`: `<KEYCLOAK_URL>/realms/<KEYCLOAK_REALM>` (both
             default null, `settings.py:144-145`, which formats as the
             truthy string `None/realms/None`);
           - otherwise, or when the mapped value is falsy: `OIDC_ISSUER_URL`
             (default null, `settings.py:149`). None: 503 `Must define Issuer
             URL (OIDC_ISSUER_URL) in server configuration to use OpenID
             Connect.`

           Then GET `<issuer stripped of '/'>/.well-known/openid-configuration`
           (timeout 2 s). Any exception, including a non-JSON body: 503
           `Could not get OpenID configuration from well known URL: <e>`
           (`:33-39`). No `issuer` member: `ApiError` with no code, which is
           **500** (`exceptions.py:10`), `OpenID Connect issuer response
           invalid: <error or message or document>` (`:41-43`). The
           document's `issuer`, after `.format(tenantid=AZURE_TENANT)`, must
           equal the issuer URL exactly (unstripped), else 503 `Issuer Claim
           does not match Issuer URL used to retrieve OpenID configuration`
           (`:45-46`); an issuer containing other `{...}` fields makes
           `.format` raise (generic 500, inferred). With `OIDC_VERIFY_TOKEN`
           (default **false**, `settings.py:153`), GET `jwks_uri` (timeout
           2 s) and build `{kid: RSAAlgorithm.from_jwk(key)}`; any failure,
           including a non-RSA key in the set, gives 503 `Could not get
           OpenID JWT Key Set from JWKS URL: <e>` (`:48-54`). A missing
           `token_endpoint` or `userinfo_endpoint` raises KeyError (generic
           500, `:70-71`).
        2. Body (`:73-77`): `code` and `redirectUri` are required; `clientId`
           is required by all three supported client-authentication methods.
           A missing member is an uncaught KeyError: generic **500**, not
           400. `clientId` is not compared with `OAUTH2_CLIENT_ID`.
        3. Client authentication (`:79-117`): the IdP's
           `token_endpoint_auth_methods_supported` (default
           `['client_secret_basic']`; a non-list is wrapped). The first entry
           of `OIDC_TOKEN_AUTH_METHODS` (default `client_secret_basic`,
           `client_secret_post`, `client_secret_jwt`, `settings.py:151`) that
           the IdP lists is used; if none is listed, `client_secret_post`
           (the initial value) is used anyway. The token request is a form
           POST of `grant_type=authorization_code`, `code`, `redirect_uri`:
           - `client_secret_basic`: HTTP Basic `clientId` :
             `OAUTH2_CLIENT_SECRET` (`settings.py:99`);
           - `client_secret_post`: adds `client_id` and `client_secret`;
           - `client_secret_jwt`: adds `client_assertion_type`
             `urn:ietf:params:oauth:client-assertion-type:jwt-bearer` and an
             HS256 `client_assertion` signed with `OAUTH2_CLIENT_SECRET`
             (`iss` = `sub` = `clientId`, `aud` = the token endpoint, a uuid4
             `jti`, `exp` now + 5 min, `iat` now);
           - any other configured method that the IdP lists: 400 `Token
             endpoint auth method '<m>' is not supported by Alerta.`
           The token POST, and the userinfo GET in step 6, have **no
           timeout** (`:93`, `:97`, `:115`, `:146`), unlike discovery.
           Reference availability defect: a slow IdP holds the worker.
        4. Token response (`:118-122`): a non-JSON body raises (generic
           500). An `error` member gives `ApiError(error_description or
           error)` with no code, so **500**; an invalid or reused `code`
           therefore surfaces as 500.
        5. ID token (`:124-142`): the unverified header gives `kid` and
           `alg`. With `OIDC_VERIFY_TOKEN`, `jwt.decode` uses
           `jwt_key_set[kid]` and `algorithms=<the header's own alg>`, with
           no `audience`; PyJWT 2.12.1 then raises InvalidAudienceError for
           any token that carries a non-empty `aud` (`api_jwt.py:517-522`),
           which OIDC ID tokens do, so in verify mode the ID token is
           inferred to be **always discarded**. Without it (the default),
           the token is decoded with `verify_signature: False`, which also
           turns off `exp`, `aud`, `iss` and the other claim checks
           (`api_jwt.py:79-88`). Any exception (no `id_token`, unknown
           `kid`, bad token) is logged and gives `id_token = {}`; the flow
           continues. No `nonce` is sent or checked anywhere in the server.
           **SECURITY AUTH-SEC-5 (ID-token verification absent or
           ineffective):** by default the ID token's signature and claims are
           not verified; in verify mode the algorithm is taken from the
           token's own header (PyJWT's docstring warns against this,
           `api_jwt.py:204-215`) and every failure is swallowed. Boundary:
           the ID token arrives in the server-side token-endpoint response
           from the discovered issuer (requests' default TLS verification),
           so the HTTP caller does not supply it directly. Source-derived,
           NOT_RUN.
        6. Userinfo (`:144-149`): GET `userinfo_endpoint` with
           `Authorization: <token_type or Bearer> <access_token>`; any
           exception (no `access_token`, network error, non-JSON body): 500
           `No access token in OpenID Connect token response.` (an
           `ApiError` with no code). Then `sub` = `userinfo['sub']`; a
           userinfo body without `sub` (for example an error object) raises
           KeyError (generic 500, `:151`).
        7. Claim mapping (`:151-169`), userinfo first, then the ID token
           (an `or` chain, so a falsy userinfo value falls back): `name`,
           `preferred_username`, `nickname`, `email`, `picture`.
           `email_verified` = userinfo's value if userinfo has the key, else
           the ID token's value if it has the key, else `bool(email)`; so
           the email fallback applies only when **both** sources omit the
           claim, and an explicit `false` from either is kept. Then the
           string `'true'` becomes `True` and every other value is kept as is
           (`:156-157`). Custom
           claims: `{OIDC_ROLE_CLAIM: ..., OIDC_GROUP_CLAIM: ...}` (defaults
           `roles` and `groups`, `settings.py:154-155`), each from userinfo,
           else the ID token, else `[]`; equal claim names collapse into one
           entry. `login` = `preferred_username` or `nickname` or `email`;
           none: 400 `Must support one of the following OpenID claims:
           'preferred_username', 'nickname' or 'email'`.
        8. Local user (`:171-181`): when `OIDC_LINK_USER_EMAIL` (default
           **true**, `settings.py:157`) and `email` and `email_verified` are
           truthy, look up by email (`SELECT * FROM users WHERE email=%s`,
           `postgres/base.py:1055-1057`); otherwise by id = `sub`. Not found:
           create `User(id=sub, name, login, password '', email,
           roles=USER_ROLES, text '', email_verified)`; an insert error (for
           example a duplicate `login` or `email`, both UNIQUE,
           `sql/schema.sql:161`, `:177`) is not caught: generic 500. Found:
           `update(login, email, email_verified)`; an email without `@`
           raises ValueError (generic 500, `models/user.py:174-176`). The
           update's return value is discarded, so later steps use the
           **pre-update** row (old email, domain and roles).
           **SECURITY AUTH-SEC-6 (identity linking on IdP-asserted, possibly
           unverified attributes):** linking is selected when
           `OIDC_LINK_USER_EMAIL`, `email` and the resolved `email_verified`
           are all truthy (`:171`), and binds the IdP identity to any
           existing local account with that email. If both userinfo and the
           ID token omit `email_verified`, it defaults to `bool(email)`
           (`:156`), so a truthy email links. Non-empty strings, including
           `'false'`, stay strings and are truthy (`:157`); an empty string,
           `false`, `null` or `0` is falsy and does not link. The linked
           account's stored roles join the role list, and a stored email
           listed in `ADMIN_USERS` gives `ADMIN_ROLES` when the row is loaded
           (`models/user.py:39`). Separately, `Permission.lookup` and
           `get_customers` take `login`, which prefers `preferred_username`
           (`:167`, `:196-197`), and compare it with `ADMIN_USERS`
           (`postgres/base.py:1278`, `:1352-1353`); an issuer whose users can
           choose that claim can supply a value listed there.
           Source-derived, NOT_RUN.
        9. `roles` = role claim + `user.roles`; a non-list role claim (for
           example a string) makes the `+` raise TypeError (generic 500).
           `groups` = the group claim. If the user's id differs from `sub`
           (an email-linked account), `custom_claims['oid']` = the local id
           (`:183-187`).
        10. Checks (`:189-193`): `status` other than `active`: 403 `User
            <login> is not active`. `not_authorized('ALLOWED_OIDC_ROLES',
            roles)` or `not_authorized('ALLOWED_EMAIL_DOMAINS',
            [user.domain])`: 403 `User <login> is not authorized`; both are
            no-ops while `AUTH_REQUIRED` is false, and `user.domain` is the
            pre-update value. The local user was already created or updated.
            **SECURITY AUTH-SEC-7 (role allowlist silently ineffective):**
            `ALLOWED_OIDC_ROLES` is computed once inside `settings.py` from
            that module's own defaults (`settings.py:156`, so `['*']`). Only
            **environment variables** named `ALLOWED_GITLAB_GROUPS` or
            `ALLOWED_KEYCLOAK_ROLES` feed it (`utils/config.py:59-65`, then
            `:71`); the same keys set in a configuration file
            (`utils/config.py:23-24`) change keys that nothing reads, leaving
            every role admitted. `ALLOWED_OIDC_ROLES` itself, set in a
            configuration file or the environment, does take effect
            (`utils/config.py:71`). Source-derived, NOT_RUN.
        11. Last login; `scopes` = `Permission.lookup(login, roles)`;
            `customers` = `get_customers(login, groups + ([user.domain] if
            user.domain else []))`; `user.domain` is null when the login has
            no `\` and the email is absent or has no `@`, which OIDC allows
            with a `preferred_username` or `nickname` login
            (`models/user.py:47-55`) (NoCustomerMatch: 403)
            (`:194-197`).
        12. Audit event `openid-login` (connected only as described under
            `/auth/login`), with the custom claims as extra fields and
            `resource_id` = `sub` (`:199-201`).
        13. Token (`:203-206`): `sub` = the IdP's `sub` (not the local id
            when linked; the local id is in `oid`, and the permission
            decorator uses `oid or sub` as the user id,
            `auth/decorators.py:83`); `provider` = `AUTH_PROVIDER`;
            `preferred_username` = `login`; `email`, `email_verified` (which
            may be a non-boolean, step 7) and `picture` from the claims. The
            custom claims are passed as keyword arguments: `Jwt` keeps only
            `roles`, `groups`, `orgs` and `oid` (`models/token.py:29-40`),
            so a non-default `OIDC_ROLE_CLAIM` or `OIDC_GROUP_CLAIM` name
            drops that list from the token, and the token's `roles` is the
            IdP claim alone, without `user.roles`. A claim name equal to a
            `create_token` or audit parameter (`email`, `name`, `scopes`,
            `customers`, `user`, `type`, ...) raises TypeError (generic 500).
            200 `{token}`.

        With the default settings (`AZURE_TENANT` `common`, every
        `ALLOWED_*` list `['*']`, `AUTH_REQUIRED` false), any account the
        issuer authenticates is admitted with at least `USER_ROLES` scopes.

        Source-derived; runtime NOT_RUN.
      requestBody: &oidcBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri, clientId]
              properties:
                code: {type: string, description: "authorization code from the IdP redirect"}
                redirectUri: {type: string, description: "sent as redirect_uri; not validated by the server"}

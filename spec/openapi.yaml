      x-scope: write:webhooks
      summary: Custom webhook dispatcher (generic; provider mappings are separate)
      description: &webhookDispatch |
        Dispatcher only. The twelve provider `incoming()` mappings
        (`alerta/webhooks/*.py`) are separate slices and are not specified
        here. GET and POST run the same handler (`custom.py:17-21`); with
        no sub-path, `path` is `''` and the provider receives the full
        request path (`path or request.path`, for example `/webhooks/slack`).

        Order:
        1. The blueprint's `before_request` (`__init__.py:17-24`) runs for
           every method, **before authentication**. It builds a log string
           from `request.method`, `request.url` (including any `?api-key=`),
           all request headers (including `Authorization` and `X-API-Key`)
           and the whole body decoded as UTF-8, and logs it at INFO
           (W-SEC-1). The string is built whatever the log level, so a
           non-UTF-8 body raises before the view and gives 500 (unhandled
           exception). The body is cached, so the view still sees it.
        2. `OPTIONS`: with flask-cors 6.0.2's effective
           `automatic_options` true (the default; Alerta does not set
           `CORS_AUTOMATIC_OPTIONS`), `cross_origin` answers with the
           default options response and CORS headers, **without** calling
           the permission check or the handler. If the configuration sets
           it false, the permission check and handler run instead (W-N1).
        3. The permission check for `write:webhooks` (credential precedence
           above). When it rejects, the caller gets 401 or 403 before any
           404. Under precedence branches 3 and 4 (no credentials with
           `AUTH_REQUIRED` false, or with `ALLOW_READONLY`) there is **no
           scope check**, so an anonymous caller reaches the handler and
           can submit alerts through any loaded webhook. Under branch 5 the
           view's behavior is NOT established (`g.login` is unset).

        A concrete instance of `/webhooks/{webhook}`: the dispatcher order,
        auth, logging (W-SEC-1), error mapping and responses there all
        apply. Present only while the `telegram` entry point loaded
        successfully. This entry documents the mapping only.

        **No alert is created**; all work happens inside `incoming`
        (`:70-106`), in the parsing stage:

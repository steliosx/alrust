        429 or raises ends the request. Items before it are already
        stored; items after it are **never processed**, and the response
        describes only the stopping item. Success: exactly one item gives
        201 `{status: ok, id, alert}`; zero or two or more give 201
        `{status: ok, ids}` without alert objects (an empty list gives
        `ids: []`).

        Audit: events go to the `write` audit signal (`alert-rejected`,
        `alert-rate-limited`, `alert-heartbeat`, `alert-blackout`,
        `webhook-received`), which is connected only when `AUDIT_TRAIL`
        includes `write` (default `['admin']`) and `AUDIT_LOG` or
        `AUDIT_URL` is set (`utils/audit.py:27-46`).


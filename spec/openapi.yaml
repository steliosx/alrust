  /environments:
    get:
      operationId: listEnvironments
      x-source: alerta/views/alerts.py:485-517; alerta/database/backends/postgres/base.py:637-681
      x-scope: read:alerts
      description: |
        **The environment list is not filtered** (`base.py:639`): the
        page of names comes from `SELECT DISTINCT environment FROM alerts`
        over **all** alerts, ignoring the filters and the customer scope.
        Only the per-environment counts use the filtered query, so a
        customer-scoped caller also sees environment names that occur only
        in other customers' alerts (customer-mapping C20). Counts cover the
        caller's matching rows: a name with none shows zero, while a shared
        name can show a non-zero count, so no zero count is guaranteed.
        - `total` is the **filtered** `COUNT(DISTINCT environment)`, so it
          can disagree with the listed page.
        - **SECURITY (reference defect):** the listed names are then
          formatted into a SQL literal list, `environment in ('<name>', ...)`,
          without escaping (`base.py:646`). Stored environment values are
          normally limited by the reject policy, but an alert received with
          `status: blackout` skips the pre-receive plugins (lifecycle R1
          step 1), so a `write:alerts` caller can store an arbitrary
          environment string that later becomes SQL text (second-order
          injection class). Source-level only; not exercised.
        - Counts use `GROUP BY environment, CUBE(severity, status)` with a
          1000-row limit.
      parameters:
        - {$ref: '#/components/parameters/Q'}
        - {$ref: '#/components/parameters/QDf'}
        - {$ref: '#/components/parameters/AlertFilters'}
        - {$ref: '#/components/parameters/AlertQueryId'}
        - {$ref: '#/components/parameters/AlertDateRange'}
        - {name: to-date, in: query, schema: {type: string}, description: "see from-date"}
        - {$ref: '#/components/parameters/Page'}
      responses:
        "200":
          description: "`environments` items: {environment, severityCounts, statusCounts, count}. Empty gives `message: not found` and total 0"
          content:
            application/json:
              schema:
                type: object
                required: [status, environments, page, pageSize, pages, more, total]
                properties:
                  status: {const: ok}
                  environments: {type: array, items: {type: object}}
                  page: {type: integer}
                  pageSize: {type: integer}
                  pages: {type: integer}
                  more: {type: boolean}
                  total: {type: integer}
                  message: {const: not found}
        "416": {description: "page out of range", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "400": {description: "invalid filter or sort name, or q parse failure", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}

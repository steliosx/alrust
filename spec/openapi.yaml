  /alert/{alert_id}/attributes:
    parameters: [{$ref: '#/components/parameters/AlertPathId'}]
    put:
      operationId: updateAlertAttributes
      x-source: alerta/views/alerts.py:249-272; alerta/models/alert.py:464-465; alerta/database/backends/postgres/base.py:339-349
      x-scope: write:alerts
      description: |
        A read-modify-write in Python: the attributes loaded by the lookup
        are updated with the request map, and every key whose value is
        `null` is dropped, so `{"k": null}` **deletes** `k`. The full
        result replaces the column. Concurrent updates can therefore lose
        each other's keys.
        - Keys containing `.` or `$` are **accepted** here, unlike on
          receive (R0.2).
        - No history entry, `updateTime` unchanged, no plugins.
        - A missing or empty `attributes` gives 400.
        - A non-object value goes through Python `dict.update`. Most such
          values give 500. A list of two-character strings or of pairs is
          accepted as key/value pairs (Python semantics; NOT verified).

        **Committed, then 500.** The view tests the returned map for
        truthiness (`views/alerts.py:269`). When the result is empty, for
        example removing the only attribute with `{"k": null}`, the
        UPDATE has already been committed (`_updateone` commits before it
        returns, `pg.py:1568-1576`) and the response is **500**
        `failed to update attributes`. Source-derived, NOT verified.

        The write itself uses `WHERE id = <full id> OR id LIKE '<full id>%'`
        (`pg.py:279-357`), so, as for heartbeat delete, a row whose id extends the
        found id is also written. Generated uuid4 ids make this practically
        exact; client-supplied ids do not. Source-derived, NOT verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes: {type: object}

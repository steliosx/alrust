openapi: 3.1.0
info:
  title: Alerta API as implemented (reference v9.1.0) - slices extracted for alrust
  version: "9.1.0-f4312727"
  description: |
    Phase 0 item 1: an OpenAPI description of the reference server **as
    implemented** (the code, not the docs). It is extracted slice by slice.

    - Source: `reference/alerta` @ `f4312727783dad64198b62ed778bbca98a5144a3`.
      `x-source` gives `path:line` inside that tree.
    - Evidence level: SOURCE_DERIVED unless an operation's `x-runtime` says
      otherwise.
    - Slices in this file: **heartbeats**; **single alerts** (`POST /alert`
      and the per-id alert operations); **alert queries** (`/alerts`,
      `/alerts/count`, `/alerts/history`, the top-N endpoints,
      `/environments`, `/services`, `/alerts/groups`, `/alerts/tags`) with
      their query parameters, including the `q=` grammar; **alert notes**;
      **blackouts**; **API keys**; **users**; **groups**; **permissions**
      (with `/scopes`); **customers**; **`/config`**; **management**;
      the root index `/` and `/_`; the **webhook dispatcher**
      (`/webhooks/{webhook}`) and the **prometheus** provider mapping.
      Not yet written: the other eleven provider webhook payload mappings, the auth routes and other routes
      the static inventory lists.
    - **Reference security defects** are recorded where found (marked
      SECURITY). They describe the class of problem at source level only;
      no exploit was built or run. They are recorded for the owner's
      decision; this spec describes the reference and decides nothing
      about alrust.
    - Cross-references: `spec/lifecycle.md` R0-R7, A0-A5 and HB0-HB6;
      `spec/customer-mapping.md` C7-C11 and C16-C19.

    Common behavior (every operation below):
    - Credentials follow `auth/decorators.py:25-175`: an API key
      (`Authorization: Key`, `X-API-Key`, or `?api-key=`), Hawk, Bearer,
      proxy, Basic, or none when `AUTH_REQUIRED` is false
      (customer-mapping C1-C4).
    - Unless an operation says otherwise (for example `/_` and the
      webhook dispatcher), every route also accepts `OPTIONS` (CORS), and
      `?callback=` wraps the response body as JSONP
      (`utils/response.py:7-19`).
    - Errors use the ApiError body (`exceptions.py:98-107`). Unhandled
      exceptions (for example SQL errors) return 500 with message `An
      internal error has occurred!` (`exceptions.py:120-136`).

    Credential precedence, applied by `permission()` to every operation:
    1. A supplied API key is checked first. An invalid or expired key gives
       **401**, even when `AUTH_REQUIRED` is false (C1). A valid, unexpired
       key is recorded as used with one `UPDATE keys SET
       last_used_time=NOW() at time zone 'utc', count=count + 1 WHERE
       id=<key> OR key=<key>` (`models/key.py:162-166`,
       `database/backends/postgres/base.py:1002-1005`), so **every
       API-key-authenticated request, reads included, writes to `keys`**
       before the handler runs (UW-R1).
    2. Then Hawk, Bearer, proxy and Basic, in that order.
    3. With no credentials and `AUTH_REQUIRED` false, access is anonymous,
       with scopes `[]` and no scope check (`:156-161`).
    4. With `AUTH_REQUIRED` and `ALLOW_READONLY`, a request without
       credentials gets `READONLY_SCOPES` and is then dispatched **without
       checking the endpoint's required scope** (`:164-169` returns the
       handler directly, with no `is_in_scope` call), so this branch also
       reaches `write:*` and `delete:*` endpoints. **Reference auth defect**
       (AN1, found by Codex; static source inspection only, no request
       executed, handler outcomes NOT_RUN). Whether alrust keeps this is an
       owner authentication-contract decision.
    5. With `AUTH_REQUIRED` true, `ALLOW_READONLY` false and no
       credentials, a request carrying a truthy `X-Appengine-Cron` header
       and `X-Forwarded-For` exactly `0.1.0.1` is let through with **no scope
       check** (Google App Engine cron, `:171-173`). This branch sets none of
       `g.login`, `g.scopes` or `g.customers`; what the views then do
       (customer filtering, audit, errors) is NOT established. Whether alrust
       keeps this branch is an owner decision on the authentication
       contract; this spec only records it.
    6. Otherwise the request gets 401.

    The API key, Bearer, proxy and Basic branches check the required scope,
    giving 403 when it is missing (`:51-52`, `:88-89`, `:119-120`,
    `:150-151`). The Hawk branch assigns `ADMIN_SCOPES` to any
    authenticated signature and dispatches without a check (`:56-67`). Branches 3, 4
    and 5 dispatch without a scope check. The `{}` security alternative
    below therefore means access without credentials, to **any** endpoint,
    under branches 3, 4 and 5.
servers:
  - url: /
    description: Relative to the server's base URL
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    apiKeyAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: "`Key <api-key>`"
    apiKeyQuery:
      type: apiKey
      in: query
      name: api-key
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HS256 JWT signed with SECRET_KEY; audience OAUTH2_CLIENT_ID, else SAML2_ENTITY_ID, else absolute_url(); the `scope` claim becomes the caller's scopes (models/token.py:43-76; auth/decorators.py:69-91)"
    basic:
      type: http
      scheme: basic
      description: "login:password against the local user table (auth/decorators.py:124-151). The decoded pair is split on ':', so a password containing ':' gives 400. Every BasicAuthError (this branch, and the auth-proxy missing-scope 403 at :120) carries `WWW-Authenticate: Basic realm=<BASIC_AUTH_REALM>`, default `Alerta` (exceptions.py:110-117; settings.py:81)"
    hawk:
      type: apiKey
      in: header
      name: Authorization
      description: "`Authorization: Hawk id=..., ts=..., nonce=..., mac=...` (auth/decorators.py:56-67; credentials HMAC_AUTH_CREDENTIALS, auth/hmac.py). Not gated by any configuration flag. Any valid signature is given ADMIN_SCOPES and dispatched without a scope check (precedence branch 2). OpenAPI has no registered `hawk` HTTP scheme, so it is modelled as this header."
    authProxy:
      type: apiKey
      in: header
      name: X-Proxy-User
      description: "Only when AUTH_PROXY is true (default false). The header name is AUTH_PROXY_USER_HEADER (default X-Proxy-User); roles come from AUTH_PROXY_ROLES_HEADER (default X-Proxy-Roles), split on AUTH_PROXY_ROLES_SEPARATOR (default ','); an unknown user is created when AUTH_PROXY_AUTO_SIGNUP (default true), else ApiError 403 without the header (auth/decorators.py:93-122; settings.py:92-96). The enabling flag and configurable names cannot be expressed in OpenAPI; this entry shows the defaults. Anyone who can reach the server directly can set this header, so a deployment must strip it at the proxy."
  responses:
    Unauthorized: {description: "invalid or expired API key, bad token, or no credentials while AUTH_REQUIRED (auth/decorators.py:42-45, :174-175)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: "missing required scope (auth/decorators.py:51-52 and peers)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ServerError: {description: "ApiError 500, or an unhandled exception with message 'An internal error has occurred!' (exceptions.py:120-136)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    UnsupportedMediaType: {description: "POST or PUT without a JSON Content-Type, rejected by the `api` blueprint before the handler (views/__init__.py:17-20), including on routes that read no body", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  parameters:
    ListSortBy:
      name: sort-by
      in: query
      style: form
      explode: true
      schema: {type: array, items: {type: string}}
      x-source: alerta/database/backends/postgres/utils.py:28-52
      description: |
        Repeatable. Each value is a sort name accepted by the resource (listed on
        each operation), optionally prefixed `-` to flip that name's default
        direction; an unknown name gives 400 `Sorting by '<name>' field not
        supported.` Without `sort-by` the query is `ORDER BY (select 1)`: no
        defined order. Sort columns are emitted unquoted, so `sort-by=user` on
        `/keys` sorts by PostgreSQL's `user` (CURRENT_USER), not the column
        (source-derived, NOT_RUN).
    WebhookName:
      name: webhook
      in: path
      required: true
      description: "A successfully loaded custom webhook name (the loaded registry, not the setup.py entry-point list)"
      schema: {type: string}
    AlertFilters:
      name: filters
      in: query
      style: form
      explode: true
      schema: {type: object, additionalProperties: {type: string}}
      x-source: alerta/database/backends/postgres/utils.py:19-22, :55-104, :107-198
      description: |
        Built by `Alerts.from_params` then `QueryBuilder.filter_query`.
        Every predicate below is ANDed. A customer-scoped caller also gets
        `customer = ANY(g.customers)` (C16).
        `from_params` runs on **every** endpoint in this slice, so `q`,
        filters, `id`, dates, `sort-by` and `group-by` are parsed (and an
        invalid filter or `sort-by` name gives 400) everywhere, even where
        the result is not sorted or grouped. Only `/alerts` sorts, and only
        the top-N endpoints use `group-by`.

        **Names.** Excluded names are skipped by the generic filter:
        `_`, `callback`, `token`, `api-key`, `q`, `q.df`, `id`,
        `from-date`, `to-date`, `sort-by`, `group-by`, `page`, `page-size`,
        `limit`, `show-raw-data`, `show-history`. Accepted filter names are
        `resource`, `event`, `environment`, `severity`, `correlate`,
        `status`, `service`, `group`, `value`, `text`, `tag`,
        `attributes`, `attributes.<k>`, `origin`, `type`, `createTime`,
        `timeout`, `rawData`, `customer`, `duplicateCount`, `repeat`,
        `previousSeverity`, `trendIndication`, `receiveTime`,
        `lastReceiveId`, `lastReceiveTime`, `updateTime`, each optionally
        with a `!` suffix. Anything else, including `tags`, gives 400
        `Invalid filter parameter: <name>`.

        **Generic path** (every accepted name except `service` and
        `attributes.<k>`):
        - one value: `= v`; `~v` means `ILIKE '%v%'`; a `!` suffix
          negates (`!=` or `NOT ILIKE`);
        - several values: `= ANY(values)`, or, when **any** value starts
          with `~`, a case-insensitive **unanchored** regex made by
          joining all values with `|` after stripping `~`, so plain values
          become regex fragments too (`status=open&status=~ack` is
          `status ~* 'open|ack'`). Regex metacharacters are live.
        - **Several values with one empty** (for example `resource=` plus
          `resource=x`) raise IndexError in `[v[0] for v in value]`
          (`utils.py:91`, `:98`) before any SQL. That is an unhandled
          exception, mapped to the generic 500 `An internal error has
          occurred!` (`exceptions.py:120-136`). HTTP outcome NOT_RUN. A single
          empty value does not raise (`= ''`), and the `service` and
          `attributes.<k>` paths do not index values.

        **`service`**: array overlap, `service && ARRAY[values]`. The
        `service!` form falls to the generic path: one value compares the
        text[] column with a text parameter, which PostgreSQL may parse as
        an array literal (value-dependent, as for `tag=v`); NOT verified.

        **`attributes.<k>=v`**: `attributes @> {"k": first value}`. Extra
        values are ignored, `~` is literal, and a trailing `!` becomes
        part of the key.

        **`duplicateCount` and `repeat` can get two predicates that share
        one query variable** (`duplicate_count` or `repeat`):
        - **Prerequisite:** the special equality (`utils.py:176-183`) is
          added only when `params.get(<base name>)`, the **first** value of
          the un-negated name, is non-empty. Otherwise, and for the `!`
          forms alone, only the generic predicate applies.
        - When both apply, the special code first writes the variable:
          `duplicateCount` writes the raw first string
          (`params.get('duplicateCount', int)` passes `int` as the
          *default*, not the type); `repeat` writes a boolean computed from
          `true`, `t`, `1`, `yes`, `y` or `on`. Then the generic path runs:
          - one plain value: it **overwrites** the shared variable with the
            raw string;
          - several plain values: it overwrites it with the **list** of
            strings, bound by both the special `=` and the generic
            `= ANY(...)`;
          - one `~v` value: it overwrites it with the wildcard string
            `%v%`, bound by both the special `=` and the generic `ILIKE`;
          - several values including a `~`: it writes only a separate
            `regex_*` variable, so the shared variable keeps the special
            value (the raw first string for `duplicateCount`, the computed
            **boolean** for `repeat`).

        How PostgreSQL treats each binding (integer or boolean parsing, a
        list or wildcard against a scalar column) is inferred: potential
        500s, NOT verified. Evidence for the bindings: Codex's six-case
        pinned-werkzeug body probe (single, repeated and single-`~`
        branches) and her separate three-case probe of the
        repeated-with-`~` branch (for example `repeat=true&repeat=~false`
        gives `repeat: true` and `regex_repeat: 'true|false'`). Both are
        body probes only, with no app, SQL or HTTP.

        **Potential SQL failures** (inferred, NOT verified; no universal
        500 is claimed):
        - `tag=v`: generic path, `"tags" = 'v'` compares text[] with a text
          parameter (array-literal caveat as for heartbeats). Several `tag`
          values give `"tags" = ANY(text[])`, a text[]-to-text comparison
          that is inferred to fail for any value.
        - `type` maps to column `event_type`, but the alerts column is
          `type` (`base.py:417`): inferred missing-column 500 for any
          value, and for `sort-by=type`.
    AlertQueryId:
      name: id
      in: query
      schema: {type: array, items: {type: string}}
      style: form
      explode: true
      x-source: alerta/database/backends/postgres/utils.py:184-191
      description: |
        - One value: `alerts.id LIKE 'v%' OR last_receive_id LIKE 'v%'`,
          case-sensitive; `%` and `_` in `v` are live wildcards.
        - Several values: `id ~* '^v1|^v2' OR last_receive_id ~* ...`,
          case-insensitive, with regex metacharacters live.
        - This differs from the per-id path, which always uses the regex
          (C18).
    AlertDateRange:
      name: from-date
      in: query
      schema: {type: string}
      x-source: alerta/database/backends/postgres/utils.py:165-174; werkzeug 3.1.7 MultiDict.get
      description: |
        `from-date` gives `last_receive_time > v`; `to-date` (a separate
        parameter of the same form) gives `last_receive_time <= v`. Both
        use the format `%Y-%m-%dT%H:%M:%S.%fZ` as UTC.
        - **A malformed date is silently ignored.** The value is converted
          by `MultiDict.get(type=DateTime.parse)`, and werkzeug 3.1.7 (the
          pinned version) returns the default when the conversion raises
          ValueError or TypeError.
        - `to-date` defaults to the query time (the app clock) on
          `GET /alerts` only; the other endpoints have no upper bound unless
          it is given.
        - **Binding:** the pinned backend registers a datetime adapter
          (`postgres/base.py:86`, `:126-127`) that sends every datetime as
          an untyped quoted ISO literal, `'YYYY-MM-DDThh:mm:ss.sssZ'`,
          truncated to **milliseconds**, not as a timestamptz parameter. The
          `last_receive_time` column is a timestamp without time zone, so
          the literal is read as a plain timestamp. The session TimeZone is
          therefore not expected to shift these comparisons (inferred; SQL
          NOT_RUN). Stored times pass through the same adapter. The
          observed session zone in the query reference run was `Etc/UTC`
          (metadata only).
    AlertSortBy:
      name: sort-by
      in: query
      schema: {type: array, items: {type: string}}
      style: form
      explode: true
      x-source: alerta/database/backends/postgres/utils.py:28-52, :109-138; base.py:410-440
      description: |
        Any accepted name with a sort column (all filter names except
        `tag`, plus `tags`), or `attributes.<k>`; a `-` prefix reverses it.
        Anything else gives 400 `Sorting by '<name>' field not supported.`
        - Base directions are ascending, except `createTime`,
          `receiveTime`, `lastReceiveTime` and `updateTime`, which are
          descending.
        - `severity` sorts by the alarm model's severity code, and
          `status` by its status state. Both use an **inner** JOIN against
          the model's VALUES list (`base.py:425-432`), so an alert whose
          severity or status is not in the model **drops out of the page**,
          while the severity and status counts still include it. If that
          empties the page, `GET /alerts` takes its empty-page branch (see
          there). PUT status stores any string (lifecycle A1.2), so this is
          reachable. Source-derived, NOT verified.
        - **No `sort-by` means no ordering**: the ORDER BY is
          `(select 1)`, which is truthy, so the `last_receive_time`
          fallback in `get_alerts` never applies. Page contents are then
          unordered.
        - **SECURITY (reference defect):** for `attributes.<k>`, the second
          dot-separated segment (`split('.')[1]`) is inserted into the ORDER BY clause as
          `attributes->'<k>'` by string formatting, with no quoting or
          parameter (`utils.py:38-39`, `:46-47`). Request text therefore
          becomes SQL text (injection class). Source-level only; not
          exercised. The same `sort_by_columns` serves heartbeats and other
          lists.
    AlertGroupBy:
      name: group-by
      in: query
      schema: {type: string}
      x-source: alerta/database/backends/postgres/utils.py:196; base.py:555-625
      description: |
        Used only by the top-N endpoints (first value), which default to
        `event`. The value names the grouping column and the response key.
        - **SECURITY (reference defect):** the value is **not validated**
          and is formatted directly into `SELECT {group}` and
          `GROUP BY {group}` (`base.py:557-568`, `:585-596`, `:611-623`).
          Request text therefore becomes SQL text (injection class). An
          invalid column name is a SQL error (500). Source-level only; not
          exercised.
    Page:
      name: page
      in: query
      schema: {type: integer, default: 1}
      x-source: alerta/utils/paging.py:9-33
      description: |
        `page`, `page-size` and the deprecated `limit` alias. A non-integer
        is silently replaced by the default (werkzeug `MultiDict.get`), and
        `page-size` 0 means `DEFAULT_PAGE_SIZE`. 416 `page out of range` is
        returned when `page` < 1, or when there are items and `page` >
        pages.
    Q:
      name: q
      in: query
      schema: {type: string}
      x-source: alerta/database/backends/postgres/utils.py:144-157; alerta/database/backends/postgres/queryparser.py:1-289
      x-evidence: "SOURCE_DERIVED; the translations below were confirmed by pure-parser probes of the pinned queryparser.py with pinned pyparsing 3.3.2: Claude's on Python 3.14 and Codex's on Python 3.12 (review 3e035b53, including the flat-chain and backslash cases). No app, SQL or HTTP. SQL execution of every translation is NOT_RUN."
      description: |
        A Lucene-like query string, parsed by `QueryParser` into a SQL
        fragment that **replaces** the initial `1=1`; the other filters are
        still ANDed after it. An empty `q` is ignored (falsy). The same parser
        serves blackouts (`utils.py:231-240`, a later slice).

        **Errors.** A `ParseException` gives 400 `Failed to parse query
        string.` with the exception in `errors` (a nested traceback list,
        see Error). **Trailing input is silently ignored:** `parseString` is
        called without `parseAll` (`queryparser.py:287`), so `foo )bar`
        parses as `foo` alone. Only input with no parseable prefix (for
        example `)`) gives 400.

        **Fields.** `field:term`; with no field, the default field
        (`q.df`, else `text`). Field names are used **directly as SQL
        column names** in double quotes, not mapped from API names: use
        `last_receive_id`, not `lastReceiveId`. An unknown column is an
        inferred SQL error (500, NOT verified). Field names are words of
        printable characters excluding `=><(){}[]^"~*?:\/.&|`, so they
        cannot contain `"`. A `%` in a field name reaches the SQL text and
        is an inferred driver formatting error (500, NOT verified).
        **There is no working backslash escape in words.** The word parse
        action strips backslashes (`queryparser.py:239-241`), but `\` is
        itself an excluded character (`:237`), so a word ends at a
        backslash: `foo\bar` parses as `foo` with the rest dropped as
        trailing input, and a leading `\foo` gives 400. Phrases
        (`QuotedString('"')`) and regexes (`QuotedString('/')`) define no
        escape character either.

        **Terms** (all values are bound parameters):
        - bare word `v`: `"field" ILIKE '%v%'`, a case-insensitive
          **substring** match, not equality (`severity:major` also matches
          any value containing `major`);
        - on `tags`, `service` or `correlate`: exact element match,
          `'v' = ANY("field")`, case-sensitive;
        - `"a phrase"`: `"field" ~* '\ya phrase\y'`, a case-insensitive
          regex with word boundaries. **The phrase text is a regex**:
          metacharacters are live. On `tags`, `service` or `correlate` it is
          an exact element match instead;
        - wildcard (only `[a-z0-9]*[?*][a-z0-9]*`, lowercase): `*` becomes
          `.*` and `?` becomes `.?` (zero or one character, unlike Lucene),
          wrapped in `\y...\y` word boundaries;
        - `/regex/`: `"field" ~* 'regex'`, unanchored;
        - ranges `[a TO b]`, `{a TO b}` and mixed brackets: `>=`/`>` and
          `<=`/`<`, with `*` meaning unbounded (`1=1`); one-sided `>=v`,
          `>v`, `<=v`, `<v`. Bounds are text parameters that PostgreSQL
          coerces to the column type (inferred);
        - `_exists_:k`: attribute key present, `attributes ? 'k'`;
        - `_.k:v` (attribute): `attributes->>'k' ILIKE '%v%'`, or the regex
          form for a phrase. For any other prefix word `p.k`, `p` has
          **every** `_` replaced by `attributes` and is used as a jsonb
          column name: `raw_data.x:y` becomes `"rawattributesdata"`, an
          inferred missing-column 500;
        - `field:(sub query)`: the subquery's default field is replaced by
          `field` (or the attribute key for `_.k:(...)`).

        **Operators**, in precedence order: the `+` and `-` modifiers, then
        `NOT`/`!`, then `AND`/`&&`, then `OR`/`||` or adjacency (**`a b`
        means OR**).
        - **Reference defect: flat chains keep only their first two
          operands.** `BinaryOperation` stores only `tokens[0][0]`,
          `[1]` and `[2]` (`queryparser.py:20-26`), while pyparsing groups
          a same-level chain into one token list. So `a AND b AND c`
          translates to `a AND b` (**wider** results), and `a OR b OR c`,
          `a b c` or `a b c d` translate to `a OR b` (**narrower** results).
          This also holds inside a subquery: `resource:(web OR db OR app)`
          keeps only `web` and `db`. The dropped operands are silently
          ignored, with no error. The examples `a AND b OR c` and
          `a AND (b AND c)` keep every operand **only because each binary
          group in them has exactly two operands**. Parentheses or mixing
          do not repair a longer flat group: `a AND b AND c OR d` drops `c`,
          `(a AND b AND c)` drops `c`, and `a AND (b AND c) AND d` drops `d`
          (Codex probe 591429de). Confirmed by both
          agents' pure-parser probes; SQL/HTTP NOT_RUN. How alrust treats
          this is not decided here.
        - **`+` and `-` are emitted verbatim as SQL unary operators**
          (`-a` becomes `- "text" ILIKE ...`), which is inferred to fail in
          SQL (500, NOT verified). They do not have Lucene's required or
          prohibit meaning.
        - **`a OR NOT b` becomes `a AND NOT b`** (`queryparser.py:50-57`),
          the same as `a NOT b`.
    QDf:
      name: q.df
      in: query
      schema: {type: string}
      x-source: alerta/database/backends/postgres/utils.py:149-151; queryparser.py:284-289
      description: |
        The default field for `q` terms without a field (default `text`).
        - **SECURITY (reference defect):** the value is not validated. It
          replaces the placeholder `__default_field__` in the generated SQL
          text by plain string replacement (`queryparser.py:289`), inside a
          double-quoted identifier, with no escaping. Request text
          therefore becomes SQL text (injection class), reachable with
          `read:alerts`. Source-level only; not exercised. A benign column
          name such as `resource` works as documented.
    AlertPathId:
      name: alert_id
      in: path
      required: true
      schema: {type: string}
      description: |
        Looked up by `get_alert`: `id ~* '^<v>' OR last_receive_id ~*
        '^<v>'`, a case-insensitive **regex** prefix on the raw path value,
        plus `customer = ANY(g.customers)` when the caller has customers
        (`pg.py:293-299`; customer-mapping C16-C18).
        - Regex metacharacters are live: `.` matches any character. An
          invalid regex, for example `(`, is inferred to give 500 (NOT
          verified).
        - If several rows match, which one is used is undefined.
        - A customer-scoped key gets 404 for another customer's alert
          (C17).
  schemas:
    KeyInput:
      type: object
      additionalProperties: true
      description: "Read by ApiKey.parse (models/key.py:45-61) for POST /key. Unknown members are ignored."
      properties:

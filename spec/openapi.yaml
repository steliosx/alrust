      summary: Prometheus Alertmanager webhook (provider mapping)
      description: |
        A concrete instance of `/webhooks/{webhook}`: the dispatcher order,
        auth, logging (W-SEC-1), batch handling (W-DL-1), error mapping and
        responses there all apply. Present only while the `prometheus` entry

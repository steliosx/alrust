      x-scope: write:alerts
      description: |
        `tags = ARRAY(SELECT DISTINCT UNNEST(tags || <new>))`: a union that
        is de-duplicated, with **undefined order**. No history entry is
        written and `updateTime` is unchanged. No plugins run.

        **A missing or empty `tags` gives 500, not 400.** The view raises
        `ApiError("must supply 'tags' as json list")` without a code, and
        `BaseError.code` defaults to 500 (`exceptions.py:9-10`).

        `tags` is not type-checked (NOT verified beyond source): a JSON
        string is passed as text, which PostgreSQL may accept when it is an
        array literal such as `{a,b}` and is otherwise a potential 500; an
        object is a potential driver adaptation error (500). The audit event is sent before
        the write. The write itself uses `WHERE id = <full id> OR id LIKE '<full id>%'`
        (`pg.py:279-357`), so, as for heartbeat delete, a row whose id extends the
        found id is also written. Generated uuid4 ids make this practically
        exact; client-supplied ids do not. Source-derived, NOT verified.

  /auth/login:
    post:
      operationId: authLogin
      x-source: alerta/auth/login.py:7-18; alerta/auth/basic.py:67-105; alerta/auth/basic_ldap.py:12-182; alerta/auth/__init__.py:44-54; alerta/auth/utils.py:36-73; alerta/models/token.py:78-118
      x-scope: none
      summary: Password login (basic or LDAP), or the CAS ticket path; returns a Bearer token
      security: [{}]
      description: |
        No permission decorator: credentials sent with the request (API key,
        Bearer, Basic) are ignored. The route takes `OPTIONS` (CORS,
        `cross_origin(supports_credentials=True)`) and `POST`. No auth route
        has the `jsonp` decorator, so `?callback=` is ignored on every route
        in this slice.

        **Dispatch** on `AUTH_PROVIDER` (default `basic`, `settings.py:63`),
        read on each request (`login.py:10-18`):
        - `ldap`: `basic_ldap.login()`, the LDAP path below.
        - `cas`: `cas.cas_login()` (`cas.py:129-224`), the CAS ticket path,
          listed only under `POST /auth/cas`.
        - anything else: `basic.login()`, the basic path below. This
          includes `openid`, `saml2`, `github`, `azure` and the other SSO
          providers, so password login against the local user table stays
          available under every SSO provider.

        **Body handling** (both password paths):
        1. The auth blueprint's `before_request` (`auth/__init__.py:44-54`)
           rejects a POST whose Content-Type is not JSON with 415.
        2. A JSON Content-Type with an empty or malformed body: reading
           `request.json` raises BadRequest (Flask 3.1.3
           `flask/wrappers.py:212-219`; werkzeug 3.1.7
           `wrappers/request.py:644-645`), so **400** with message
           `400 Bad Request: ...` (`exceptions.py:83-95`).
        3. Valid JSON that is not an object (`null`, a list, a string, a
           number): `.get` raises AttributeError, which is not the caught
           KeyError, so the generic **500** `An internal error has occurred!`.
        4. An object without `password`, or without a truthy `username` and
           without `email`: KeyError, so **401** `must supply 'username' and
           'password'` (`basic.py:69-73`; `basic_ldap.py:14-18`). A falsy
           `username` (for example `""`, `0` or `false`) falls through to
           `email`, whatever its type. The selected value is not
           type-checked, and what happens next depends on the path:
           - basic: it is passed to SQL for both `login` and `email`
             (`models/user.py:194-199`, `postgres/base.py:1051-1053`). A JSON
             `null` (for example `username` and `email` both null) becomes
             SQL NULL, matches no row, and gives 401 `Invalid username or
             password`. Other non-string types may give an adapter or SQL
             error (inferred generic 500, NOT_RUN).
           - LDAP: after the empty-password check, `'\\' in login` and
             `login.split(...)` run before any SQL (`basic_ldap.py:20-27`).
             `null` or a number raises TypeError at the membership test; a
             list or object passes it and raises AttributeError at `split`.
             Neither is the caught ValueError, so generic 500 (NOT_RUN).

        **Basic path** (`basic.py:67-105`), in order:
        1. `User.check_credentials` (`models/user.py:194-199`): `SELECT *
           FROM users WHERE login=%s OR email=%s` with the username for both
           (`postgres/base.py:1051-1053`; if two rows match, an arbitrary one
           is used), then bcrypt `checkpw` on the first 72 UTF-8 bytes of the
           password (`auth/utils.py:27-29`). No row, or a wrong password:
           401 `Invalid username or password`.
           - **SECURITY AUTH-SEC-2 (empty password accepted):** there is no
             empty-password check (contrast `basic_ldap.py:20-21`). A user
             created by `POST /user` without `password` stores the hash of
             `''` (`models/user.py:67`), so the password `""` logs in as that
             user. This answers the question left open on `POST /user`.
             Source-derived, NOT_RUN.
           - **SECURITY AUTH-SEC-3 (account enumeration):** the password is
             encoded only after a row is found (`auth/utils.py:28`), so a
             non-string JSON password gives 500 (AttributeError) for an
             existing login or email and 401 for an unknown one; bcrypt also
             runs only when a row exists (a timing difference).
             Source-derived, NOT_RUN.
           - Users created by LDAP, OIDC, SAML, CAS, GitHub or the auth
             proxy store the literal `''` as the password, not a hash
             (`basic_ldap.py:135`, `oidc.py:177`, `saml.py:89`, `cas.py:171`,
             `github.py:73`, `auth/decorators.py:107`). What bcrypt 5.0.0
             `checkpw` does with that stored value is NOT established
             (inferred: an exception, so 500).
        2. `EMAIL_VERIFICATION` (default false, `settings.py:215`) and a
           falsy `email_verified`: `send_confirmation()` stores a new
           confirmation hash and mails a link built from the request's
           `Referer` (`models/user.py:212-215`, `auth/utils.py:76-92`), then
           403 `email not verified`. This repeats on every correct-password
           attempt. With no `Referer`, `link(None, ...)` raises
           AttributeError (`auth/utils.py:77`): inferred 500, NOT_RUN. Mail
           delivery itself is not traced here.
        3. `not_authorized('ALLOWED_EMAIL_DOMAINS', [user.domain])`
           (`auth/utils.py:36-39`): 403 `unauthorized domain` only when
           `AUTH_REQUIRED` is true (default false, `settings.py:62`) and the
           list (default `['*']`, `settings.py:100`) holds neither `*` nor
           the domain. `user.domain` is the part before `\` when the stored
           `login` contains a backslash, else the email's domain, else null
           (`models/user.py:47-55`).
        4. `status` other than `active`: 403 `User <login> not active`.
        5. `UPDATE users SET last_login=NOW() at time zone 'utc'`
           (`models/user.py:170-171`, `postgres/base.py:1063-1069`).
        6. `groups` = the names of the user's groups; `scopes` =
           `Permission.lookup(user.login, roles=user.roles + groups)`
           (`models/permission.py:113-114`, `postgres/base.py:1277-1293`;
           rules under `/group`). `ADMIN_USERS` (default `[]`,
           `settings.py:64`) is compared here with the **login**
           (`postgres/base.py:1278`); separately, the `User` constructor
           gives `ADMIN_ROLES` to any loaded row whose stored **email** is
           listed (`models/user.py:39`), so either attribute confers
           `ADMIN_SCOPES`. `customers` =
           `get_customers(user.login, groups + ([user.domain] if
           user.domain else []))` (`basic.py:95`, `auth/utils.py:42-49`):
           `[]` when `CUSTOMER_VIEWS` is off
           (default, `settings.py:76`); otherwise `Customer.lookup`
           (`models/customer.py:85-87`, `postgres/base.py:1351-1367`) matches
           the login, then each group, then the domain (only when
           `user.domain` is truthy), against `customers.match`. An `ADMIN_USERS` login or a `*` customer gives
           `[]`; no match raises NoCustomerMatch, which becomes 403 `No
           customer lookup configured for user '<login>' or '<matches>'`.
        7. Audit event `basic-auth-login` on the `auth` signal
           (`basic.py:97-99`). The signal is connected only when
           `AUDIT_TRAIL` contains `auth` (default `['admin']`,
           `settings.py:178`) and `AUDIT_LOG` or `AUDIT_URL` is set
           (`utils/audit.py:42-46`), so by default nothing is recorded. The
           record includes the request JSON with a top-level `password`
           replaced by `[REDACTED]` while `AUDIT_LOG_REDACT` is true (the
           default) (`utils/audit.py:83-90`).
        8. Token: `create_token(provider='basic', roles=user.roles,
           groups=groups, email=user.email,
           email_verified=user.email_verified, ...)`; 200 `{token}`.

        **LDAP path** (`basic_ldap.py:12-182`; only when `AUTH_PROVIDER` is
        `ldap`, which needs python-ldap at startup, `auth/__init__.py:9-15`):
        1. Body as above; an empty `password` gives 401 `password not allowed
           to be empty` (`:20-21`).
        2. Split the login (`:23-33`): `DOMAIN\user`, else `user@domain`.
           Neither form, or more than one separator, falls back to
           `LDAP_DEFAULT_DOMAIN` (default `''`, `settings.py:136`) with the
           whole login as the username; with no default domain, 401
           `expected username with domain`.
        3. While `LDAP_USE_EMAIL_DOMAIN_WHITELIST` is true (the default,
           `settings.py:132`), the domain must be listed in
           `ALLOWED_EMAIL_DOMAINS` or be a key of `LDAP_DOMAINS` (default
           `{}`, `settings.py:123-125`), else 403 `unauthorized domain`
           (`:36-39`). This is plain membership: `*` is **not** a wildcard
           here, and the check applies even when `AUTH_REQUIRED` is false.
        4. Process-global python-ldap options are set on every request
           (`:42-56`): `LDAP_CACERT` (hard certificate check),
           `LDAP_ALLOW_SELF_SIGNED_CERT`, `LDAP_TIMEOUT` (default -1, which
           is truthy, so it is always set), and each `LDAP_CONFIG` item via
           `getattr(ldap, <name>)`, so an unknown name raises (500).
        5. `ldap.initialize(LDAP_URL)`; an error gives 500 with its text
           (`:59-63`). In Flask debug mode the trace level is 2 (`:60`); what
           python-ldap writes at that level is NOT established.
        6. With `LDAP_BIND_USERNAME` set, a service bind; invalid
           credentials give 500 `invalid ldap bind credentials` (`:66-72`).
           Other LDAP errors (for example an unreachable server) are not
           caught: generic 500.
        7. Locate the user (`:86-124`):
           - With `LDAP_USER_FILTER`: a subtree search under
             `LDAP_USER_BASEDN` or `LDAP_BASEDN`, filter
             `LDAP_USER_FILTER.format(username=<escaped username>)`,
             attributes `LDAP_USER_NAME_ATTR` (default `cn`) and
             `LDAP_USER_EMAIL_ATTR` (default `mail`); results containing
             `None` (referrals) are dropped. More than one result: 500
             `invalid search query for domain "<domain>"`; none: 401
             `invalid username or password`. `name` is the first name value
             (a missing name attribute raises KeyError: 500). When the
             entry has a non-empty list of email values, `email` = the first
             value decoded and `email_verified` = `bool(email)`; a first
             value that decodes to `""` therefore gives `email = ""`, not
             verified, and is **not** rejected by the missing-email check
             below (`:108-111`). When the email attribute is absent or its
             value list is empty: 401 `User LDAP entry missing required
             email attribute` while the whitelist flag is on, else email
             `<escaped username, lowercased>@ldapdomain.invalid`, not
             verified (`:112-116`).
           - Without a filter: the DN is `LDAP_DOMAINS[domain]` with the
             escaped username inserted by `%` or by `.format()`; `name` is the
             escaped username and the email `<username>@<domain>` (both
             escaped), not verified. A domain that is not a key of
             `LDAP_DOMAINS` (it passed step 3 through
             `ALLOWED_EMAIL_DOMAINS`, or the flag is off) raises KeyError:
             500.
           - **SECURITY AUTH-SEC-11 (DN and filter construction):** the
             username is escaped with `escape_filter_chars`, which is LDAP
             filter escaping (`:92-93`), and is then also placed in a DN
             (`:118-121`), where DN escaping would apply. The group filter
             (step 10) inserts `email` and `userdn` without escaping
             (`:155`). Class: LDAP DN or filter injection. Impact NOT
             established (no directory was exercised).
        8. Bind as the user's DN with the password; invalid credentials: 401
           `invalid username or password` (`:127-130`).
        9. Local user (`:132-139`): `login` = `email or username` (`:132`),
           where `username` is the step 2 value (unescaped). `email` is
           truthy on every path except the empty decoded mail value of step
           7, where `login` falls back to `username`. Lookup by `login OR
           email` (`postgres/base.py:1051-1053`):
           - Not found: `user = User(...).create()` (`:135-137`) with
             `USER_ROLES` (default `['user']`, `settings.py:67-68`), password
             `''` (unhashed) and text `LDAP user`; the constructor accepts an
             empty email (`models/user.py:29-45`). The stored row is used
             from here on. An insert error is not caught (500).
           - Found: `update(login, email, email_verified)` (`:139`). An empty
             email fails the update's email check (`'@' not in ''`,
             ValueError, generic 500, `models/user.py:174-176`) before any
             token. Otherwise the return value is discarded, so the rest of
             the request uses the **pre-update** row
             (`models/user.py:173-182`).
           The service account is bound again if configured (`:141-145`).
        10. Groups (`:148-162`): with `LDAP_GROUP_FILTER`, a subtree search
            under `LDAP_GROUP_BASEDN` or `LDAP_BASEDN` with
            `LDAP_GROUP_FILTER.format(username=, email=, userdn=)`, collecting
            the values of `LDAP_GROUP_NAME_ATTR` (default `dn`), or the entry
            DN when the entry lacks that attribute.
        11. `status` other than `active`: 403 `User <login> not active`;
            then `not_authorized('ALLOWED_LDAP_GROUPS', groups)` (default
            `['*']`, `settings.py:138`; effective only with `AUTH_REQUIRED`):
            403 `User <login> is not authorized` (`:165-168`). The local user
            was already created or updated in step 9.
        12. Last login; `scopes` = `Permission.lookup(login,
            roles=user.roles + groups)` and `customers` =
            `get_customers(login, groups + ([user.domain] if user.domain
            else []))` (`:171-172`) as in the basic path; audit event
            `basic-ldap-login` (`:174-176`).
        13. Token (`:179-182`): provider `ldap`; `preferred_username` and
            `email` are both `user.email`, not the step 9 `login`: for a
            found user the pre-update stored email, for a new user the
            created row's email. When that email is empty (a new user from
            the empty-mail case), both claims are omitted, since
            `serialize` keeps them only when truthy
            (`models/token.py:92-95`). Roles `user.roles`; groups the LDAP
            group names or DNs.

        **Token** (`create_token`, `auth/utils.py:52-73`; `Jwt.serialize`
        and `tokenize`, `models/token.py:78-118`; schema TokenClaims):
        - Always present: `iss` = `request.url_root`; `typ` `Bearer`;
          `sub` = the user id; `aud` = `OAUTH2_CLIENT_ID`, else
          `SAML2_ENTITY_ID`, else `absolute_url()`, which is `BASE_URL` or
          else `request.url_root` (`utils/response.py:22-27`); `exp` = now +
          `TOKEN_EXPIRE_DAYS` days (default 14, `settings.py:174`); `nbf` and
          `iat` = now; `jti` = a uuid4. Times are naive UTC, encoded as
          integer seconds (PyJWT 2.12.1 `api_jwt.py:132-135`). With
          `BASE_URL` empty and no client or entity id, the audience depends
          on the request's host, so a token minted through one host name is
          rejected with `Invalid audience` through another.
        - Only when truthy: `name`, `preferred_username` (the login),
          `email`, `provider`, `orgs`, `groups`, `roles`, `scope` (the
          scopes **space-joined**; omitted when there are none), `oid`.
          Only when not null: `email_verified`, `picture` (never set on
          these two paths). `customers`: present, possibly `[]`, exactly when
          `CUSTOMER_VIEWS` is on.
        - Signed HS256 with `SECRET_KEY`.
          **SECURITY AUTH-SEC-4 (default signing key):** `SECRET_KEY`
          defaults to `changeme` (`settings.py:15`; kept by
          `utils/config.py:29` unless the environment overrides it) and
          nothing rejects that value at startup; PyJWT 2.12.1 only warns on
          a short HMAC key (`api_jws.py:192-197`, `:360-365`). The same key
          signs the itsdangerous confirmation and reset tokens
          (`auth/utils.py:106-112`). A deployment that keeps the default
          issues tokens that anyone who knows the default can forge.
          Source-derived, NOT_RUN.
        - The token is stateless: later changes to roles, groups, status or
          customers do not affect it before `exp` (see `/group`).

        Source-derived; runtime NOT_RUN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: "The body depends on AUTH_PROVIDER (login.py:10-18): the password object for basic (and any non-ldap, non-cas provider) and ldap; the CAS ticket object for cas. Neither alternative applies to the other provider."
              anyOf:
                - title: Password login (AUTH_PROVIDER other than cas)
                  type: object
                  required: [password]
                  description: "`username` (truthy) or else `email` must be present (basic.py:69-73; basic_ldap.py:14-18)."
                  properties:
                    username: {type: string, description: "login or email (basic); `DOMAIN\\user`, `user@domain` or a bare name with LDAP_DEFAULT_DOMAIN (LDAP); not type-checked"}
                    email: {type: string, description: "used when `username` is absent or falsy"}
                    password: {type: string, description: "basic: only the first 72 UTF-8 bytes count; LDAP: must be non-empty"}
                  additionalProperties: true
                - title: CAS ticket (AUTH_PROVIDER=cas; inventory depth, see POST /auth/cas)
                  type: object
                  description: "Both members must be present and truthy, else 400 `Fields 'ticket' and 'service' are required` (cas.py:135-138); an empty string is falsy and gets the same 400. No password is read."
                  required: [ticket, service]
                  properties:
                    ticket: {type: string, minLength: 1}
                    service: {type: string, minLength: 1}
                  additionalProperties: true
      responses:
        "200": &authTokenOk {description: "Token issued", content: {application/json: {schema: {$ref: '#/components/schemas/AuthToken'}}}}
        "400": {description: "JSON Content-Type with an empty or malformed body (werkzeug BadRequest); under AUTH_PROVIDER=cas also the CAS errors listed under POST /auth/cas", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {description: "`must supply 'username' and 'password'`; `Invalid username or password` (basic) or `invalid username or password` (LDAP); LDAP also `password not allowed to be empty`, `expected username with domain`, `User LDAP entry missing required email attribute`", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "403": {description: "`email not verified`; `unauthorized domain`; `User <login> not active`; LDAP `User <login> is not authorized`; NoCustomerMatch text", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "415": {$ref: '#/components/responses/AuthUnsupportedMediaType'}
        "500": {description: "non-object JSON body; non-string password for an existing user (AUTH-SEC-3); LDAP `invalid ldap bind credentials`, `invalid search query for domain ...`, initialize errors and uncaught LDAP or KeyError failures; or the generic handler (exceptions.py:120-136)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

          (so `url_root` is used) or is itself absolute. `BASE_URL` is any
          string and is not validated (`utils/config.py:27`): a relative value
          such as `/api` gives `uri` `/api`, the `/` rule's `href` `/api/`
          and `/api/alerts`, with no exception (ROOT-C4). A `BASE_URL`
          ending in `/` also doubles the slash on the `/` rule's own
          `href`.
        - For Flask rules, `method` joins the rule's methods minus `HEAD` and
          `OPTIONS` in set order, which is not defined.
        - The list is sorted by `href`.
        This exposes the route map, including management and custom webhook
        names, without credentials (source-derived; the reference run below
        used `AUTH_REQUIRED` false and a synthetic key, so it does not test
        this).

      additionalProperties: true
      required: [resource, event]
      description: |
        What the **parser accepts** (lifecycle R0). Unknown fields are
        ignored. Parse errors give 400. The policy rules noted on
        `environment` and `service` below are **not parser validation**:
        they come from the reject plugin, which runs only when the
        pre-receive plugin chain runs. With the default ALERTA model, an
        incoming `status` of `blackout` is suppressed
        (`alarms/alerta.py:255-257`), and `process_alert` then skips the
        whole pre-receive chain (`utils/api.py:35-40`; lifecycle R1 step
        1): no reject policy, no `remote_ip`, no heartbeat or blackout
        plugin, and no post-receive rewrite.
        - With the default plugins and a non-blackout status, `remote_ip`
          sets `attributes.ip` to `next(iter(request.access_route),
          request.remote_addr)` (`plugins/remote_ip.py:16-19`), overwriting
          any client-sent `ip`. `access_route` comes from `X-Forwarded-For`
          when present, so the value can be influenced by the client or a
          proxy. This `ip` attribute was observed at runtime (metadata
          mutations window 01, loopback `127.0.0.1`).
        Where no `type` is given, the parser does not check the type, and
        success for other value types is NOT established.
        - **Absent and present-null differ** for the four containers:
          absent takes the default, while a present `null` fails the
          list/object check and gives 400 (`alert.py:83-90`).
        A JSON body that is not an object gives 500 (AttributeError, as for
        HeartbeatInput; inferred, NOT verified).
      properties:
        id: {description: "not type-checked; falsy gives a server uuid4. A supplied id is used for a new alert; on duplicate or correlate the stored id is kept and the new id becomes lastReceiveId (R5, R6)"}
        resource: {description: "required: absent or falsy gives 400 (:28-29); type not checked"}
        event: {description: "required: absent or falsy gives 400 (:30-31); type not checked. `Heartbeat` is diverted (HB3)"}
        environment: {description: "when the reject plugin runs (see above), must fully match ALLOWED_ENVIRONMENTS or the request gets 403 (R1.2); not checked for an incoming blackout status"}
        severity: {description: "not checked at parse time. An unknown severity gives 500, not 400 (R1.1)"}
        correlate: {type: array, description: "absent gives []; present must be a list (null gives 400). Non-empty gets the event appended (R0.6)"}
        status: {description: "`blackout` bypasses the pre-receive plugins (R1 step 1)"}
        service: {type: array, description: "absent gives []; present must be a list (null gives 400); empty gives 403 when the reject plugin runs (R1.2), not for an incoming blackout status"}
        group: {}
        value: {}
        text: {}
        tags: {type: array, description: "absent gives []; present must be a list (null gives 400); element types not checked"}
        attributes: {type: object, description: "absent gives {}; present must be an object (null gives 400); keys with `.` or `$` give 400 (R0.2); null values are dropped by the post-receive rewrite (R1.3), which does not run for an incoming blackout status; remote_ip adds `ip` (see above)"}
        origin: {}
        type: {}
        createTime:
          description: |
            A string must match `%Y-%m-%dT%H:%M:%S.%fZ` (400 otherwise). A
            non-string value, including null, is silently ignored and the
            server uses now (`format.py:55-57`).
        timeout: {type: [integer, boolean, "null"], description: "R0.4: null gives ALERT_TIMEOUT; booleans become 1 or 0; strings, floats and negative values give 400"}
        rawData: {}
        customer: {description: "the parser only rejects `\"\"` (400) and does not check the type; otherwise assigned by assign_customer, which can give 400 (C7-C11). Success for non-string values is NOT established"}

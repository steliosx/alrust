        API, auth, management, webhooks), plus one per custom webhook
        (`/webhooks/<name>`, methods `POST,GET`).
        - Each entry is `{rel: endpoint name, href: absolute_url(rule), method}`.
          `href` keeps the rule's `<param>` placeholders.
        - `absolute_url(path)` is `urljoin(base + '/', path.lstrip('/'))`.
          For the literal `/` rule the joined path is empty, so its own
          `href` is `base + '/'`. With `BASE_URL` empty, `base` is `url_root`,
          which already ends in `/`, so that one `href` ends in **two**
          slashes (for example `http://127.0.0.1:18081//`) while `uri` and
          every other `href` have one (RI-HF1; ROOT-C3; source-derived, no
          HTTP run).
        - If reading `BASE_URL` or `url_root` raises (no app or request
          context), `absolute_url` falls back to base `/`. Then `uri` is `/`,
          the `/` rule's `href` is `//`, and every other `href` is
          `urljoin('//', path)`, for example `///alerts` (Python stdlib
          behavior, checked offline). Absolute links are therefore not
          unconditional (ROOT-C2).

        found id is also written. Generated uuid4 ids make this practically
        exact; client-supplied ids do not. Source-derived, NOT verified.

        Housekeeping deletion is separate (K1).

        **Forwarding loop gives 500, and the local delete is skipped.** A
        request whose loop header already names this server makes
        `forwarder.delete` raise ForwardingLoop (`plugins/forwarder.py:103-105`).
        ForwardingLoop is not an AlertaException, so `process_delete` wraps it
        as `ApiError("Error while running delete plugin 'forwarder': ...")`
        under the default `PLUGINS_RAISE_ON_ERROR`, and the view answers 500
        (`views/alerts.py:297-298`). By contrast, PUT action answers a loop
        with 202 (A2.2), and PUT status has no loop check (the forwarder's
        `status_change` is a no-op, `plugins/forwarder.py:69-70`).
        Source-derived, NOT verified.

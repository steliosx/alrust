        service: {type: array, description: "must be a list when present (a present null gives 400)"}
        tags: {type: array, description: "must be a list when present (a present null gives 400)"}
        resource: {description: "`\"\"` gives 400"}
        event: {description: "`\"\"` gives 400"}
        group: {description: "`\"\"` gives 400"}
        origin: {description: "`\"\"` gives 400; any origin sets priority 8"}
        customer: {description: "assigned by assign_customer with admin:blackouts (C11)"}
        startTime: {description: "string in `%Y-%m-%dT%H:%M:%S.%fZ` (else 400); non-string or absent means now"}
        endTime:
          description: |
            As startTime. When set, `duration = int(end - start)` with no

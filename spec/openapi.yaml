        Payload (`incoming`, `:110-116`): if the payload is falsy or lacks an
        `alerts` key, 400 `no alerts in Prometheus notification payload`.
        `'alerts' in payload` is a substring test when the dispatcher fell
        back to raw text; such a body then fails at `payload.get(...)` (`:113`)
        with AttributeError, which the dispatcher turns into **400** `'str'
        object has no attribute 'get'` (WP-R1).

        Exception rule for the `incoming()` parsing stage (everything in
        this entry up to the produced alerts): the dispatcher maps any
        exception other than `TypeError` (and AlertaException) to 400 with
        its text, but a `TypeError` triggers the legacy retry without
        `path`, which fails again with a missing-argument TypeError: an
        unhandled **500**. Mapping covers the whole list before any alert
        is processed, so one bad item fails the request before any of this
        batch's alerts enters `process_alert` or is stored by the
        dispatcher. That is not "no side effects": a valid API key has
        already caused its usage UPDATE (UW-R1), and the webhook
        `before_request` logging ran before authentication (W-SEC-1). After
        parsing, the dispatcher's processing stage applies instead
        (`custom.py:55-73`): there a TypeError from `process_alert` becomes
        an ApiError 500 with its text, with no legacy retry, and the reject
        plugin gives 403 (WP-R4).

        `alerts` is iterated without a type check (WP-R2): an empty list,
        object or string gives no alerts, so 201 `{status: ok, ids: []}`;
        `null`, a number or a boolean is not iterable (TypeError, so 500); a
        non-empty string or object iterates characters or keys, whose missing
        `.get` gives 400.

        Per alert (`parse_prometheus`, `:16-101`), in order:
        1. `status` defaults to `firing`.
        2. Every label value `v` becomes `v.format(**labels)` (original
           labels); every annotation value becomes `v.format(**expanded
           labels)`. Any exception keeps the raw value, so non-strings and
           invalid formats pass through unchanged. Format specifications are
           payload-controlled (WP-SEC-1, source-level, Codex-confirmed with
           qualifiers: a large width allocates a large string; the pinned
           settings set no `MAX_CONTENT_LENGTH`, and deployment limits are
           not verified). No stress test was run.
        3. A truthy `annotations.alertname` replaces `labels.alertname`.
        4. `severity`: `firing` pops `labels.severity` (default `warning`);
           `resolved` uses the alarm model's normal severity
           (`DEFAULT_NORMAL_SEVERITY`, else `normal` for ALERTA or `OK` for
           ISA_18_2) and leaves any `severity` label in place, so it becomes
           a tag; any other status gives `unknown`. `warning` and `unknown`
           are ALERTA-model names; ISA_18_2's severity map has neither (its
           unknown is `Unknown`), and what processing then does is NOT
           established.
        5. `resource` = popped `exported_instance` if truthy, else popped
           `instance`; `n/a` only when `instance` is absent, so a present
           but empty or null `instance` stays `''` or null (WP-R3). A truthy
           `exported_instance` leaves `instance` as a tag.
        6. `event` = popped `event` if truthy, else popped `alertname`; with
           neither, KeyError gives 400 `'alertname'`.
        7. `environment` = popped `environment`, default config
           `DEFAULT_ENVIRONMENT` (`Production`); the reject plugin then
           applies `ALLOWED_ENVIRONMENTS` as for `/alert` (403).
        8. `customer` = popped `customer`, then `assign_customer` in the
           dispatcher.
        9. `correlate` = popped `correlate` split on `,`, else null.
        10. `service` = popped `service` split on `,`; absent gives `['']`
            (one empty string), not `[]`.
        11. `group` = popped `group` if truthy, else popped `job`;
            `Prometheus` only when `job` is absent, so a present but empty or
            null `job` stays `''` or null (WP-R3).
        12. `origin` = `prometheus/` + popped `monitor` (default `-`); a
            non-string `monitor` is a TypeError (500).
        13. `timeout` = `int(popped timeout)`, then null if `0`. Only
            `ValueError` is caught: an invalid integer string gives null
            (the server default applies); a number or boolean is truncated
            (`1.5` gives 1, `true` gives 1); `null` raises TypeError (500)
            (WP-R3).
        14. `tags` = every remaining label as `k=v`.
        15. From annotations: `value`, `summary` and `description` are
            popped; `text` = description, else summary, else
            `<SEVERITY>: <resource> is <event>`.
        16. `attributes` = `{startsAt, endsAt}` from the alert (missing keys
            give 400), then every remaining annotation (which can override
            them), plus `externalUrl` = payload `externalURL` when truthy and
            `moreInfo` = an HTML anchor built from `generatorURL` **without

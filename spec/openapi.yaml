            The parser only rejects `""` (400); it does not check the type.
            Null or absent is assigned by `assign_customer` (C11). Any other
            value goes through the same assignment rules; success for
            non-string values is NOT established.
    Blackout:
      type: object
      x-source: alerta/models/blackout.py:24-137, :190-210; alerta/sql/schema.sql:78-97
      description: |
        Every read builds the object through `Blackout.__init__`, which
        **recomputes** several fields instead of using the stored columns:
        - `duration` is recomputed as `int(endTime - startTime)` seconds;
          the stored `duration` column is not shown;

        id: {type: string}
        key: {type: string, description: "the secret"}
        status: {enum: [active, expired], description: "computed on the app clock from expireTime"}
        href: {type: string, description: "absolute URL /key/<secret>"}
        user: {type: string}
        scopes: {type: array, items: {type: string}}
        type: {type: string, description: "derived from scopes"}
        text: {type: [string, "null"], description: "null when created without text (models/key.py:53; nullable column)"}
        expireTime: {type: string}
        count: {type: integer}
        lastUsedTime: {type: [string, "null"]}
        customer: {type: [string, "null"]}
    Note:
      type: object
      x-source: alerta/models/note.py:16-67; alerta/sql/schema.sql:65-75
      properties:
        id: {type: string, description: "server uuid4"}
        href: {type: string, description: "absolute URL /note/<id>. **No /note route exists**, so this link does not resolve"}
        text: {type: [string, "null"]}
        user: {type: [string, "null"], description: "on creation, the caller's login (null when anonymous); an update sets it to the updater's login, except that an anonymous update keeps the previous value (COALESCE)"}
        attributes: {type: object, description: "on creation, a snapshot of the alert: resource, event, environment, severity, status"}
        type: {type: string, description: "`alert` for alert notes"}
        createTime: {type: string, description: "server now at creation"}
        updateTime: {type: [string, "null"]}
        _links: {type: object, description: "{alert: absolute URL of the alert} when related, else {}"}
        related: {type: object, description: "{alert: <alert id>}, present only when related"}
        customer: {type: [string, "null"], description: "copied from the alert at creation"}
    HistoryEntry:
      type: object
      x-source: alerta/models/history.py:8-34; alerta/models/alert.py:305-330, :365-379, :571-607
      description: |
        Entries are returned as stored; identifiers and times are not
        normalized. `id` and `href` identify the entry's source, which is
        **not necessarily the stored alert**:
        - duplicate and correlate entries carry the **incoming** alert's id
          (`History(id=self.id)` on the parsed alert, `alert.py:305-330`,
          `:365-379`). That is the id that becomes `lastReceiveId`; a
          client that sends no id gets a fresh uuid4 here;
        - note and dismiss entries carry the **note** id (`:571-607`);
        - create, status, action and housekeeping entries carry the stored
          alert id.
        `href` is `/alert/<entry id>` (`history.py:24`), so it need not
        resolve to this alert.
      properties:
        id: {type: string, description: "entry source id; see above"}
        href: {type: string, description: "absolute URL /alert/<entry id>; not necessarily this alert"}
        event: {type: string}
        severity: {type: [string, "null"]}
        status: {type: [string, "null"]}
        value: {}
        text: {type: [string, "null"], description: "defaults to null (history.py:14); status and action text is passed untyped to history construction. It is then adapted into the `history` composite, whose `text` field is SQL text (pg.py:26-49, sql/schema.sql:5-15); persistence, coercion and response behavior for non-string values are NOT_VERIFIED"}
        type: {type: string, description: "change type, for example new, severity, status, value, note, dismiss, action or an action name (lifecycle A0)"}
        updateTime: {type: string, description: "receive entries use the client createTime; status and action entries use server now (A0.1)"}
        user: {type: [string, "null"]}
        timeout: {type: [integer, "null"]}
    Alert:
      type: object
      x-source: alerta/models/alert.py:119-149; alerta/utils/format.py:27-65
      description: |
        Dates are serialized as `YYYY-MM-DDThh:mm:ss.sssZ` (UTC, milliseconds,
        `format.py:64-65`). Every read hydrates the row through
        `Alert.__init__`, so database NULLs in `tags` or `timeout` appear as
        `[]` and `ALERT_TIMEOUT` (lifecycle A1.3a).
      properties:
        id: {type: string}
        href: {type: string, description: "absolute URL /alert/<id>"}
        resource: {type: string}
        event: {type: string}
        environment: {type: string}
        severity: {type: string}
        correlate: {type: array, items: {type: string}}
        status: {type: string, description: "any string: PUT status stores it unvalidated (A1.2)"}
        service: {type: array, items: {type: string}}
        group: {type: string}
        value: {description: "as sent, except that JSON integers and booleans become strings (R0.3)"}
        text: {type: string}
        tags: {type: array, items: {type: string}}
        attributes: {type: object}
        origin: {type: string}
        type: {type: string, description: "request field `type`; default exceptionAlert"}
        createTime: {type: string}
        timeout: {type: integer}
        rawData: {}
        customer: {type: [string, "null"]}
        duplicateCount: {type: integer}
        repeat: {type: boolean}
        previousSeverity: {type: [string, "null"]}
        trendIndication: {type: [string, "null"]}
        receiveTime: {type: string}
        lastReceiveId: {type: string}
        lastReceiveTime: {type: string}
        updateTime: {type: [string, "null"]}
        history: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}, description: "sorted by updateTime ascending in the response (alert.py:149); stored newest first, capped at HISTORY_LIMIT"}
    AlertInput:
      type: object
      x-source: alerta/models/alert.py:26-117; alerta/utils/format.py:53-61
      additionalProperties: true
      required: [resource, event]
      description: |
        What the **parser accepts** (lifecycle R0). Unknown fields are
        ignored. Parse errors give 400. The policy rules noted on
        `environment` and `service` below are **not parser validation**:
        they come from the reject plugin, which runs only when the
        pre-receive plugin chain runs. With the default ALERTA model, an
        incoming `status` of `blackout` is suppressed
        (`alarms/alerta.py:255-257`), and `process_alert` then skips the
        whole pre-receive chain (`utils/api.py:35-40`; lifecycle R1 step
        1): no reject policy, no `remote_ip`, no heartbeat or blackout
        plugin, and no post-receive rewrite.
        - With the default plugins and a non-blackout status, `remote_ip`
          sets `attributes.ip` to `next(iter(request.access_route),
          request.remote_addr)` (`plugins/remote_ip.py:16-19`), overwriting
          any client-sent `ip`. `access_route` comes from `X-Forwarded-For`
          when present, so the value can be influenced by the client or a
          proxy. This `ip` attribute was observed at runtime (metadata
          mutations window 01, loopback `127.0.0.1`).
        Where no `type` is given, the parser does not check the type, and
        success for other value types is NOT established.
        - **Absent and present-null differ** for the four containers:
          absent takes the default, while a present `null` fails the
          list/object check and gives 400 (`alert.py:83-90`).
        A JSON body that is not an object gives 500 (AttributeError, as for
        HeartbeatInput; inferred, NOT verified).
      properties:
        id: {description: "not type-checked; falsy gives a server uuid4. A supplied id is used for a new alert; on duplicate or correlate the stored id is kept and the new id becomes lastReceiveId (R5, R6)"}
        resource: {description: "required: absent or falsy gives 400 (:28-29); type not checked"}
        event: {description: "required: absent or falsy gives 400 (:30-31); type not checked. `Heartbeat` is diverted (HB3)"}
        environment: {description: "when the reject plugin runs (see above), must fully match ALLOWED_ENVIRONMENTS or the request gets 403 (R1.2); not checked for an incoming blackout status"}
        severity: {description: "not checked at parse time. An unknown severity gives 500, not 400 (R1.1)"}
        correlate: {type: array, description: "absent gives []; present must be a list (null gives 400). Non-empty gets the event appended (R0.6)"}
        status: {description: "`blackout` bypasses the pre-receive plugins (R1 step 1)"}
        service: {type: array, description: "absent gives []; present must be a list (null gives 400); empty gives 403 when the reject plugin runs (R1.2), not for an incoming blackout status"}
        group: {}
        value: {}
        text: {}
        tags: {type: array, description: "absent gives []; present must be a list (null gives 400); element types not checked"}
        attributes: {type: object, description: "absent gives {}; present must be an object (null gives 400); keys with `.` or `$` give 400 (R0.2); null values are dropped by the post-receive rewrite (R1.3), which does not run for an incoming blackout status; remote_ip adds `ip` (see above)"}
        origin: {}
        type: {}
        createTime:
          description: |
            A string must match `%Y-%m-%dT%H:%M:%S.%fZ` (400 otherwise). A
            non-string value, including null, is silently ignored and the
            server uses now (`format.py:55-57`).
        timeout: {type: [integer, boolean, "null"], description: "R0.4: null gives ALERT_TIMEOUT; booleans become 1 or 0; strings, floats and negative values give 400"}
        rawData: {}
        customer: {description: "the parser only rejects `\"\"` (400) and does not check the type; otherwise assigned by assign_customer, which can give 400 (C7-C11). Success for non-string values is NOT established"}
    AlertIdOnly:
      type: object
      required: [status]
      properties:
        status: {const: ok}
        message: {type: string}
        id: {type: string}
paths:
  /heartbeat:
    post:
      operationId: createHeartbeat
      x-source: alerta/views/heartbeats.py:17-40
      x-scope: write:heartbeats
      summary: Create or upsert a heartbeat, keyed on (origin, customer)
      description: |
        - `ON CONFLICT (origin, COALESCE(customer, ''))` updates tags,
          attributes, create_time, timeout and receive_time, and keeps the
          stored `id` (`pg.py:851-861`; HB0.1).
        - Heartbeats can also arrive as alerts whose event is `Heartbeat`.
          That path answers 202 and is documented with `/alert` (HB3.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HeartbeatInput'}
      responses:
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "201":
          description: Created or updated
          content:
            application/json:
              schema:
                type: object
                required: [status, id, heartbeat]
                properties:
                  status: {const: ok}
                  id: {type: string}
                  heartbeat: {$ref: '#/components/schemas/Heartbeat'}
        "400": {description: "parse error, or customer not allowed (C7, C10)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
      x-runtime: "LOCAL_PASS (reference only) for the 201 shape and upsert identity: Codex vectors 9548f878, window alrust-heartbeat-vectors-reference-20260930-01, release 1ba053be, cleanup verified 4dbd2043. The selected slow-status checks executed; parser edge cases and broader derived-status, expiry and boundary coverage are NOT_RUN"
  /heartbeat/{heartbeat_id}:
    parameters:
      - name: heartbeat_id
        in: path
        required: true
        schema: {type: string}
        description: |
          Matched as `id = <v> OR id LIKE '<v>%'`, so a **prefix** matches
          (`pg.py:863-872`). When several rows share the prefix, which one
          is returned is undefined.
    get:
      operationId: getHeartbeat
      x-source: alerta/views/heartbeats.py:43-54
      x-scope: read:heartbeats
      description: |
        **No customer filter.** The view passes `g.get('customer')`
        (singular), which is never set, so any customer's heartbeat is
        returned (C19, HB4.2).
      x-runtime: "LOCAL_PASS (reference only) for per-id access without customer filtering (C19), in the same heartbeat window. Prefix matching is NOT_RUN"
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                required: [status, total, heartbeat]
                properties:
                  status: {const: ok}
                  total: {const: 1}
                  heartbeat: {$ref: '#/components/schemas/Heartbeat'}
        "404": {description: "not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteHeartbeat
      x-source: alerta/views/heartbeats.py:91-108
      x-scope: write:heartbeats
      description: |
        No customer filter, as for GET (C19).
        1. The lookup matches `id = v OR id LIKE 'v%'`. If several rows
           match, which one is chosen is undefined.
        2. `delete()` passes that row's full id to `delete_heartbeat`,
           which **again** uses `id = <id> OR id LIKE '<id>%'`
           (`heartbeat.py:178-179`, `pg.py:929-935`).

        So the deletion is not guaranteed to be exact-row. With a short
        caller id, a row `SYNTHETIC-a` also matches `SYNTHETIC-ab`. Generated
        full-uuid ids make this practically exact. This is source-derived,
        and the multi-row outcome is NOT verified. alrust keeps it unless
        the owner approves a divergence.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: ok}}}
        "404": {description: "not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
  /heartbeats:
    get:
      operationId: listHeartbeats
      x-source: alerta/views/heartbeats.py:57-88
      x-scope: read:heartbeats
      description: |
        Filtered by `customers=g.customers` (customer-mapping C16).

        **total and paging:** `total`, `pages` and `more` come from
        `COUNT(1)` over the query **without** the status filter
        (`hbv.py:62-66`, `pg.py:921-927`; HB4.1a).
        - A non-empty page reports the unfiltered total.
        - An empty page returns `total: 0` with `message: "not found"`
          (`hbv.py:78-87`).

        **Status filter:** evaluated in SQL on `NOW() at time zone 'utc'`,
        with untruncated latency. It can therefore disagree with the
        serialized `status` near the boundaries (HB4.1).

        **Order:** unordered unless `sort-by` is given (`(select 1)`,
        `pg/utils.py:50-51`).
      x-runtime: "LOCAL_PASS (reference only), same heartbeat window: customer-scoped listing, and a status filter with an empty result giving total 0. The non-empty filtered total, the other filters and sorting are NOT_RUN"
      parameters:
        - {name: status, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "repeatable and arbitrary. `ok`, `slow` and `expired` each add an OR branch in SQL; any other value is ignored, so `status=foo` alone applies no status predicate (pg.py:886-908)"}
        - {name: page, in: query, schema: {type: integer, default: 1}, description: "out of range gives 416 (paging.py:15-16)"}
        - {name: page-size, in: query, schema: {type: integer}, description: "default DEFAULT_PAGE_SIZE (50); `limit` is the deprecated alias (paging.py:19-25)"}
        - {name: sort-by, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "one of origin, tags, attributes, attributes.<k>, type, createTime, timeout, receiveTime, customer, latency, since; a `-` prefix reverses it. Anything else gives 400 (pg/utils.py:28-49, :273-288)"}
        - name: filters
          in: query
          style: form
          explode: true
          schema: {type: object, additionalProperties: {type: string}}
          description: |
            The accepted filter names are `origin`, `tag`, `attributes`,
            `attributes.<k>`, `type`, `createTime`, `timeout`, `receiveTime`,
            `customer`, `latency` and `since` (`pg/utils.py:55-104`,
            `:273-288`). Excluded names are **silently ignored**: `id` and
            the paging, sort and credential parameters (`EXCLUDE_FROM_QUERY`,
            `:19-22`). Any other name gives 400 `Invalid filter parameter`.

            **Generic path** (every name except `attributes.<k>`):
            - a single value means equality; `~v` means ILIKE `%v%`; a `!`
              suffix negates;
            - several values mean `= ANY(...)`, or a regex when any value
              starts with `~`.

            **`attributes.<k>=v`** (`:69-72`) always becomes
            `attributes @> {k: <first value>}`:
            - extra values are ignored, and `~` is taken literally;
            - a trailing `!` becomes **part of the key name**; it does not
              negate.

            **Potential SQL failures (inferred from source, NOT verified;
            no universal 500 is claimed):**
            - `tag=v` compares the `tags` text[] column with a text
              parameter. PostgreSQL parses array-literal text such as
              `{a,b}` as an array, so such values may succeed; other values
              are potential malformed-literal errors (500). Valid-literal
              behavior is NOT_RUN.
            - Plain `attributes=v` compares the jsonb column with a text
              parameter. JSON-formatted text may be accepted as jsonb;
              non-JSON text is a potential input error (500). NOT_RUN.

            **Missing-name hypotheses** (independent of the value; NOT
            verified):
            - `type` maps to column `event_type`, but the table's column is
              `type` (`sql/schema.sql:109-118`, `pg/utils.py:280`). A
              missing-column error (500) is inferred for any value; it would
              also break `sort-by=type`.
            - `latency` and `since` are SELECT-list aliases, not columns.
              That a WHERE clause cannot reference them is a hypothesis.
      responses:
        "200":
          description: A page, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [status, page, pageSize, pages, more, heartbeats, total]
                properties:
                  status: {const: ok}
                  page: {type: integer}
                  pageSize: {type: integer}
                  pages: {type: integer}
                  more: {type: boolean}
                  heartbeats: {type: array, items: {$ref: '#/components/schemas/Heartbeat'}}
                  total: {type: integer}
                  message: {const: not found, description: "present only when the page is empty"}
        "400": {description: "invalid filter or sort parameter", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "416": {description: "page out of range", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
  /alert:
    post:
      operationId: receiveAlert
      x-source: alerta/views/alerts.py:38-85; alerta/utils/api.py:14-90
      x-scope: write:alerts
      summary: Receive an alert (create, deduplicate or correlate)
      description: |
        Lifecycle R0-R7 specify the processing. Order: parse (400),
        `assign_customer` (400), then pre-receive plugins and the
        duplicate/correlate/create dispatch (R1).

        Error mapping in this view (`:55-77`):
        - RejectException gives **403** (R1.2).
        - RateLimit gives **429** with body `{status: error, message, id}`,
          which is **not** the Error shape. No bundled plugin raises
          RateLimit, so the default configuration never returns 429.
        - HeartbeatReceived, BlackoutPeriod and ForwardingLoop give **202**
          (see the response below).
        - Another AlertaException gives its own code.
        - Any other exception gives 500 whose `message` is the exception
          text, **not** the generic `An internal error has occurred!`. This
          includes the R1.1 wrap: an unknown severity gives 500.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertInput'}
      responses:
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "201":
          description: Stored (new, duplicate or correlated). There is no Location header.
          content:
            application/json:
              schema:
                type: object
                required: [status, id, alert]
                properties:
                  status: {const: ok}
                  id: {type: string, description: "the stored alert id, which differs from a supplied id on duplicate or correlate"}
                  alert: {$ref: '#/components/schemas/Alert'}
        "202":
          description: |
            Accepted but not stored as an alert:
            - event `Heartbeat`: `id` is the **heartbeat** id (HB3);
            - blackout: `id` is the parsed alert's id, and nothing is stored;
            - forwarding loop: no `id`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertIdOnly'}
        "400": {description: "parse error (R0) or customer assignment (C7-C11)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {description: "missing scope, or rejected by policy (R1.2)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "429": {description: "RateLimit from a non-bundled plugin", content: {application/json: {schema: {type: object, required: [status, message, id], properties: {status: {const: error}, message: {type: string}, id: {type: string}}}}}}
        "500": {$ref: '#/components/responses/ServerError'}
      x-runtime: "The reference smoke (create, dedup) and customer vectors ran LOCAL_PASS for their own cases only. The 202, 403, 429 and 500 branches are NOT_RUN"
  /alert/{alert_id}:
    parameters:
      - {$ref: '#/components/parameters/AlertPathId'}
    get:
      operationId: getAlert
      x-source: alerta/views/alerts.py:88-100
      x-scope: read:alerts
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                required: [status, total, alert]
                properties:
                  status: {const: ok}
                  total: {const: 1}
                  alert: {$ref: '#/components/schemas/Alert'}
        "404": {description: "not found, or another customer's alert (C17)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteAlert
      x-source: alerta/views/alerts.py:276-306; alerta/utils/api.py:203-221
      x-scope: delete:alerts
      description: |
        1. Lookup as for GET (404 when missing).
        2. `process_delete` evaluates `delete = delete and
           plugin.delete(...)` over the routed plugins (`utils/api.py:210`).
           - **Veto short-circuit:** once a plugin returns a falsy value
             (false or None), later plugins' `delete` is not called, and
             the local `alert.delete()` is skipped (`:221`). The view then
             answers 500 `failed to delete alert` (`views/alerts.py:303-306`).
             The only guarantee is that the framework's local
             `alert.delete()` call is skipped. Nothing is rolled back:
             earlier plugins may already have written locally or forwarded
             a delete (the forwarder makes remote calls,
             `plugins/forwarder.py:107-124`). No atomicity is claimed for
             custom or routed plugins.
           - NotImplementedError is ignored and leaves `delete` unchanged.
           - RejectException gives 400 and another AlertaException gives
             its own code (`utils/api.py:213-214`, `views/alerts.py:290-296`).
           - Any other exception: with `PLUGINS_RAISE_ON_ERROR` (default
             true) it becomes a 500 and the local `alert.delete()` is
             skipped, with the same no-rollback caveat; with it false it is
             logged, `delete` keeps its previous value, and the loop
             continues.
           - Of the default `PLUGINS` (`settings.py:272`), `remote_ip`,
             `reject`, `heartbeat` and `blackout` raise NotImplementedError;
             the forwarder returns true (`plugins/forwarder.py:101-126`). So
             the defaults never veto.
        3. The row is deleted. The write itself uses `WHERE id = <full id> OR id LIKE '<full id>%'`
        (`pg.py:279-357`), so, as for heartbeat delete, a row whose id extends the
        found id is also written. Generated uuid4 ids make this practically
        exact; client-supplied ids do not. Source-derived, NOT verified.

        Housekeeping deletion is separate (K1).

        **Forwarding loop gives 500, and the local delete is skipped.** A
        request whose loop header already names this server makes
        `forwarder.delete` raise ForwardingLoop (`plugins/forwarder.py:103-105`).
        ForwardingLoop is not an AlertaException, so `process_delete` wraps it
        as `ApiError("Error while running delete plugin 'forwarder': ...")`
        under the default `PLUGINS_RAISE_ON_ERROR`, and the view answers 500
        (`views/alerts.py:297-298`). By contrast, PUT action answers a loop
        with 202 (A2.2), and PUT status has no loop check (the forwarder's
        `status_change` is a no-op, `plugins/forwarder.py:69-70`).
        Source-derived, NOT verified.

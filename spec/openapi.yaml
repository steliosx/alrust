      name: q.df
      in: query
      schema: {type: string}
      x-source: alerta/database/backends/postgres/utils.py:149-151; queryparser.py:284-289
      description: |
        The default field for `q` terms without a field (default `text`).
        - **SECURITY (reference defect):** the value is not validated. It
          replaces the placeholder `__default_field__` in the generated SQL
          text by plain string replacement (`queryparser.py:289`), inside a
          double-quoted identifier, with no escaping. Request text
          therefore becomes SQL text (injection class), reachable with
          `read:alerts`. Source-level only; not exercised. A benign column
          name such as `resource` works as documented.
    AlertPathId:
      name: alert_id
      in: path
      required: true
      schema: {type: string}
      description: |
        Looked up by `get_alert`: `id ~* '^<v>' OR last_receive_id ~*
        '^<v>'`, a case-insensitive **regex** prefix on the raw path value,
        plus `customer = ANY(g.customers)` when the caller has customers
        (`pg.py:293-299`; customer-mapping C16-C18).
        - Regex metacharacters are live: `.` matches any character. An
          invalid regex, for example `(`, is inferred to give 500 (NOT
          verified).
        - If several rows match, which one is used is undefined.
        - A customer-scoped key gets 404 for another customer's alert
          (C17).

          callback_query in Telegram message}`. With a text body (step 5's raw text, including falsy JSON such as `{}`), `in` is a
          substring test, and a text containing `callback_query` fails at
          indexing (`TypeError`, so the legacy retry, then an unhandled
          **500**).
        - `user` = `<from.first_name> <from.last_name>`; `data` is split once
          on a space into a command and an alert id (no space gives 400
          from the unpacking `ValueError`). The alert is found with
          `Alert.find_by_id(id, caller's customers)`, a case-insensitive
          **regular-expression prefix** match. The action is the command
          without its leading `/`.
        - No alert and an action other than `blackout`: 200 `{status: error,
          message: alert not found for Telegram message}`.
        - `open`, `ack`, `close`: `alert.from_action(action, text 'status
          change via Telegram')`, without `write:alerts`.
        - `watch`, `unwatch`: **both untag** `<action>:<user>` (reference
          defect, as for Slack).
        - `blackout` with an alert: **creates a blackout** for that alert's
          environment, resource and event, starting now for
          `BLACKOUT_DURATION` (default 3600 s), with **no customer**. This
          needs only `write:webhooks`, not `write:blackouts`. Reference
          defect, source-level only: a customer-scoped caller can create an
          unscoped blackout that also matches other customers' alerts with
          the same environment, resource and event (see SF-BLACKOUTS for
          customer matching). `blackout` without an alert raises
          `UnboundLocalError` (a reference defect), so 400 with Python's
          message.
        - Any other action: no change.
        - Then a reply is sent to Telegram (`send_message_reply`, `:15-61`)
          when the `telepot` client is installed. It uses `TELEGRAM_TOKEN`,
          `TELEGRAM_CHAT_ID` and `DASHBOARD_URL`, from the environment or
          config, and logs any failure at WARNING with a traceback. Then a
          `webhook-updated` audit event, and 200 `{status: ok}`.


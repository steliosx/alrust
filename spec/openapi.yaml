        name: {type: string}
        text: {type: string}
        count: {type: integer}
    GroupUser:
      type: object
      x-source: alerta/models/group.py:11-45
      properties:
        id: {type: string}
        href: {type: string, description: "absolute URL /user/<id>"}
        login: {type: [string, "null"], description: "the user's login, or the email when the login is falsy (:42)"}
        name: {type: [string, "null"]}
        status: {type: [string, "null"]}
    Permission:
      type: object
      x-source: alerta/models/permission.py:14-59; alerta/sql/schema.sql:151-155
      description: |
        A role-to-scopes mapping row. `match` is compared with role names
        (and, at password login, group names) by `get_scopes_by_match`
        (`postgres/base.py:1277-1293`); see `/group` for the lookup order.
        `Scope` is a plain `str` subclass (`models/enums.py:56`), so
        `Scope(s)` does **not** validate a name.
      properties:
        id: {type: string}
        href: {type: string, description: "absolute URL /perm/<id>"}
        match: {type: string}
        scopes: {type: array, items: {type: string}}
    Customer:
      type: object
      x-source: alerta/models/customer.py:11-87; alerta/sql/schema.sql:100-106
      description: |
        A customer lookup mapping: `match` (a login, email, group name or
        email domain) maps to `customer`. `match` is NOT NULL but **not
        unique** (the unique constraint is dropped at `schema.sql:106`), and
        `customer` is nullable. `get_customers_by_match`
        (`postgres/base.py:1351-1367`) collects the `customer` of every row
        matching the login and each group or domain; any `*` means all
        customers, returned to callers as `[]`, that is **no customer
        filtering** (`models/customer.py:84-87`). See
        `spec/customer-mapping.md` section 1 for where this feeds
        `g.customers`.
      properties:
        id: {type: string}
        href: {type: string, description: "absolute URL /customer/<id>"}
        match: {type: string}
        customer: {type: [string, "null"]}
    ApiKey:
      type: object
      x-source: alerta/models/key.py:24-78, :100-111; alerta/sql/schema.sql:123-133
      description: |
        **The secret is part of every response.** `serialize` includes `key`
        (the API key secret itself) and `href` = `/key/<secret>`, so any
        response carrying an ApiKey discloses the secret (SECURITY-relevant
        reference behavior; see the endpoints for who can read keys).
        Reads rebuild the object through `from_record` then
        `ApiKey.__init__`:
        - a NULL `expire_time` becomes **now + `API_KEY_EXPIRE_DAYS`**
          (default 365; the "never expires" consequence below assumes a
          positive setting), recomputed at every read (`:31`);
        - a stored **empty** scope array becomes `USER_DEFAULT_SCOPES`
          (default `['read', 'write']`) (`:29`). A stored **NULL** scope
          array never reaches that fallback: `from_record` first iterates
          `rec.scopes` (`:105`), so NULL is an inferred TypeError and 500
          on read (NOT verified).

  /group:
    description: |
      **Groups act as roles and customer match keys at password login.**
      `POST /auth/login` (`auth/login.py:7-18`; every `AUTH_PROVIDER` other
      than `ldap` and `cas`) and `POST /auth/signup` call `basic.login` or
      `signup`, which compute `groups = [g.name for g in user.get_groups()]`
      and then:
      - scopes = `Permission.lookup(login, roles=user.roles + groups)`
        (`auth/basic.py:52-53`, `:93-94`). `get_scopes_by_match`
        (`postgres/base.py:1277-1293`) returns `ADMIN_SCOPES` for any match
        in `ADMIN_ROLES` (default `['admin']`, `settings.py:65-66`), adds the
        user or guest default scopes for `USER_ROLES` or `GUEST_ROLES`, and
        adds the scopes of any `perms` row whose `match` equals the name;
      - customers = `get_customers(login, groups + [domain])`
        (`auth/basic.py:54`, `:95`), which uses `customers.match` when
        `CUSTOMER_VIEWS` is on (`auth/utils.py:42-49`,
        `postgres/base.py:1351-1367`).
      The resulting scopes and customers are sealed into the Bearer token,
      which lasts `TOKEN_EXPIRE_DAYS` (default 14, `settings.py:174`), so a
      membership change applies at the next login and a removal does not
      revoke an issued token.
      - **SECURITY (reference defect, source-derived, NOT verified):
        `admin:groups` confers any role.** No group endpoint compares the
        scopes a group name implies against the caller's scopes (unlike the
        `roles` ceiling on `PUT /user/{user_id}`). A holder of
        `admin:groups` can create or rename a group to `admin` (or to any
        `perms` match) and add any user, including themselves, and that
        user receives `ADMIN_SCOPES` at their next password login. Under
        `CUSTOMER_VIEWS`, a group named like a `customers.match` value
        likewise widens the members' customer visibility. Traced statically;
        nothing executed. Whether alrust keeps group names as roles is an
        owner decision.
      - **Reference defect (auth proxy, inferred, NOT_RUN):** the proxy
        branch passes `user.get_groups()` (Group objects, not names) to
        `get_customers` (`auth/decorators.py:116`, `models/user.py:191-192`).
        With `CUSTOMER_VIEWS` on, a proxy user who is not in `ADMIN_USERS`
        and belongs to at least one group reaches
        `SELECT customer FROM customers WHERE match=%s` with a Group object
        as the parameter (`postgres/base.py:1357-1359`), an inferred
        adaptation error and 500 on every request that **selects the proxy
        branch** (an API key or Bearer token is checked earlier and does not
        reach it). No Group adapter is registered. The proxy branch takes
        its scopes from the roles header, not from groups (`:117`).
    post:
      operationId: createGroup
      x-source: alerta/views/groups.py:17-38; alerta/models/group.py:71-86; alerta/database/backends/postgres/base.py:1132-1138
      x-scope: admin:groups
      description: |
        - `Group.parse` reads `id`, `name` and `text`. A falsy `name` gives
          400 `Missing mandatory value for name`; a non-object body raises
          outside that handler (inferred generic 500). **A truthy
          client-supplied `id` is kept**; an omitted, null or falsy one
          becomes a new uuid4 (`models/group.py:75`). A falsy `text`
          is stored as `""`. Values are not type-checked.
        - Any insert error, such as a duplicate `name` (UNIQUE) or `id`
          (PRIMARY KEY), gives 500 whose message is the **database error
          text** (`str(e)`, `:29-30`).
        - The success body is `{status, id, group}`; `group.count` is 0.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupInput'}
      responses:
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [status, id, group]
                properties:
                  status: {const: ok}
                  id: {type: string}
                  group: {$ref: '#/components/schemas/Group'}
        "400": {description: "missing name", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}

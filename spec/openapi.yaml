        nbf: {type: [number, string, boolean, "null"], description: "as stored (api_jwt.py:480-492)"}
        iat: {type: [number, string, boolean, "null"], description: "as stored (api_jwt.py:465-478)"}
        jti: {type: [string, "null"], description: "a present non-string jti fails validation (InvalidJTIError, api_jwt.py:462-463)"}
        name: {description: "any truthy JSON value"}
        preferred_username: {description: "any truthy JSON value"}
        email: {description: "any truthy JSON value"}
        provider: {description: "any truthy JSON value"}
        orgs: {description: "any truthy JSON value"}
        groups: {description: "any truthy JSON value"}
        roles: {description: "any truthy JSON value"}
        scope: {type: string, description: "the token's `scope` string split on single spaces and re-joined; `\"\"` when absent; a non-string scope fails in parse (500)"}
        email_verified: {description: "any non-null JSON value"}
        picture: {description: "any non-null JSON value"}
        customers: {description: "only when CUSTOMER_VIEWS: `[customer]` from a legacy singular claim, else the `customers` value as stored (default [])"}
        oid: {description: "any truthy JSON value"}
    Heartbeat:
      type: object

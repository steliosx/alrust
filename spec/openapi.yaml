      summary: Custom webhook dispatcher (generic; provider mappings are separate)
      description: &webhookDispatch |
        Dispatcher only. The twelve provider `incoming()` mappings
        (`alerta/webhooks/*.py`) are separate slices and are not specified
        here. GET and POST run the same handler (`custom.py:17-21`); with
        no sub-path, `path` is `''` and the provider receives the full
        request path (`path or request.path`, for example `/webhooks/slack`).

        Order:
        1. The blueprint's `before_request` (`__init__.py:17-24`) runs for
           every method, **before authentication**. It builds a log string
           from `request.method`, `request.url` (including any `?api-key=`),
           all request headers (including `Authorization` and `X-API-Key`)
           and the whole body decoded as UTF-8, and logs it at INFO
           (W-SEC-1). The string is built whatever the log level, so a
           non-UTF-8 body raises before the view and gives 500 (unhandled
           exception). The body is cached, so the view still sees it.
        2. `OPTIONS`: with flask-cors 6.0.2's effective
           `automatic_options` true (the default; Alerta does not set
           `CORS_AUTOMATIC_OPTIONS`), `cross_origin` answers with the
           default options response and CORS headers, **without** calling
           the permission check or the handler. If the configuration sets
           it false, the permission check and handler run instead (W-N1).
        3. The permission check for `write:webhooks` (credential precedence
           above). When it rejects, the caller gets 401 or 403 before any
           404. Under precedence branches 3 and 4 (no credentials with
           `AUTH_REQUIRED` false, or with `ALLOW_READONLY`) there is **no
           scope check**, so an anonymous caller reaches the handler and
           can submit alerts through any loaded webhook. Under branch 5 the
           view's behavior is NOT established (`g.login` is unset).
        4. An unknown name gives 404 `Custom webhook '<name>' not found.`
           Valid names are exactly the **successfully loaded** custom
           registry (`utils/webhook.py:25-38`), not the setup.py entry-point
           list: a provider that fails to load is absent.
        5. Payload: `get_json(silent=True) or request.form or
           get_data(as_text=True)`. This is an `or` chain, so a falsy JSON
           body (`{}`, `[]`, `null`, `false`, `0`, `""`) or a non-JSON
           content type falls through to the form, then to the raw text:
           POST `{}` delivers the string `'{}'`. No 415 is raised: the `api`
           blueprint's JSON content-type check does not apply to this
           blueprint. No `?callback=` JSONP wrapping (no `jsonp` decorator).
        6. `incoming(path=..., query_string=request.args, payload=...)`.
           - An `AlertaException` gives its own code. `ApiError`,
             `RejectException` and the other `BaseError` classes are **not**
             AlertaException subclasses (`exceptions.py:9-66`), so a
             provider's `ApiError(..., 404)` still becomes **400**. Any
             exception other than AlertaException gives 400 with `message` =
             the exception text (compare the 500 on `/alert`).
           - A `TypeError` calls `incoming()` **again without `path`** (a
             legacy signature). That second call is outside the try, so its
             exceptions reach the app's registered handlers
             (`exceptions.py:74-80`, `app.py:67`): an `ApiError` keeps its
             code; a `BasicAuthError` keeps the code it carries (401, for example) with
             `WWW-Authenticate`; a Werkzeug `HTTPException` keeps its code;
             anything else (AlertaException included) is the generic
             unhandled 500 (W-C1). On the **first** call, all of these
             except AlertaException are caught and become 400. A TypeError raised inside a provider body, rather than
             from the signature, means the first call already partly ran.
        7. Result:
           - an `Alert` is treated as a one-item list;
           - a list is processed **item by item** (below);
           - anything else is returned as-is (provider-defined response;
             audit type `user-defined`).

        List processing, per item in order: `assign_customer` (400
        `not allowed to set customer to ...` or `must define customer ...`,
        outside the inner try), then `process_alert` with the same error
        mapping as `/alert`: RejectException 403, RateLimit 429 `{status:
        error, message, id}`, HeartbeatReceived / BlackoutPeriod 202,
        ForwardingLoop 202 without `id`, another AlertaException its own
        code, anything else **500 with the exception text**.

  /customer:
    description: |
      **Customer mappings control customer visibility.** Lookups happen only
      with `CUSTOMER_VIEWS` on (`auth/utils.py:42-49`). `ADMIN_USERS` logins
      immediately return `*` without matching stored mappings
      (`postgres/base.py:1351-1353`); other logins look up the following
      names, depending on how the user authenticated. An API key, Hawk or
      Bearer credential is checked earlier and takes precedence:
      - password login (`POST /auth/login`): the login, the user's group
        names and the email domain if any (`auth/basic.py:93-95`), after the
        usual password, account, domain and email-verification checks. The
        result is sealed into the Bearer token and **kept until the token
        expires**, not recomputed per request;
      - HTTP Basic, per request: the user's email and email domain only
        (`auth/decorators.py:146-148`);
      - auth proxy, per request: the login plus `user.get_groups()`, which
        passes Group objects, not names (`auth/decorators.py:104-116`). For a
        login not in `ADMIN_USERS` with at least one group this is the
        G-DEF-1 defect (see `/group`: an inferred 500); with no group only
        the login matches.
      - **SECURITY-relevant (source-confirmed by both agents, static, NOT
        verified): no customer ceiling on mapping writes (C-SEC-1).** `POST`
        and `PUT` require only `admin:customers` through the shared
        decorator; nothing compares the mapped `customer` with the caller's
        own `g.customers`. A customer-scoped holder of `admin:customers` can
        therefore map a name that one of the lookups above will later match
        for them (their login, one of their group names, or their email
        domain, per path) to another customer, or to `*`, which the lookup
        returns as `[]`, no customer filtering (`models/customer.py:84-87`).
        It takes effect at the next successful matching lookup. This is the
        absence of a source ceiling, not an executed exploit or a
        production-exposure finding; it parallels G-SEC-1 and P-SEC-1, and
        is an owner decision.

openapi: 3.1.0
info:
  title: Alerta API as implemented (reference v9.1.0) - slices extracted for alrust
  version: "9.1.0-f4312727"
  description: |
    Phase 0 item 1: an OpenAPI description of the reference server **as
    implemented** (the code, not the docs). It is extracted slice by slice.

    - Source: `reference/alerta` @ `f4312727783dad64198b62ed778bbca98a5144a3`.
      `x-source` gives `path:line` inside that tree.
    - Evidence level: SOURCE_DERIVED unless an operation's `x-runtime` says
      otherwise.
    - Slices in this file: **heartbeats**. Alerts, blackouts, keys, users,
      customers, management and the query grammar are not yet written.
    - Cross-references: `spec/lifecycle.md` HB0-HB6; `spec/customer-mapping.md`
      C11 and C19.

    Common behavior (every operation below):
    - Credentials follow `auth/decorators.py:25-175`: an API key
      (`Authorization: Key`, `X-API-Key`, or `?api-key=`), Hawk, Bearer,
      proxy, Basic, or none when `AUTH_REQUIRED` is false
      (customer-mapping C1-C4).
    - Every route also accepts `OPTIONS` (CORS). `?callback=` wraps the
      response body as JSONP (`utils/response.py:7-19`).
    - Errors use the ApiError body (`exceptions.py:98-107`). Unhandled
      exceptions (for example SQL errors) return 500 with message `An
      internal error has occurred!` (`exceptions.py:120-136`).

    Credential precedence, applied by `permission()` to every operation:
    1. A supplied API key is checked first. An invalid or expired key gives
       **401**, even when `AUTH_REQUIRED` is false (C1).
    2. Then Hawk, Bearer, proxy and Basic, in that order.
    3. With no credentials and `AUTH_REQUIRED` false, access is anonymous,
       with scopes `[]` and no scope check (`:156-161`).
    4. With `AUTH_REQUIRED` and `ALLOW_READONLY`, anonymous callers get
       `READONLY_SCOPES` (`:164-169`).
    5. Otherwise the request gets 401.

    A missing scope gives 403. The `{}` security alternative below
    therefore means anonymous access **only** under branches 3 and 4.
servers:
  - url: /
    description: Relative to the server's base URL
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    apiKeyAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: "`Key <api-key>`"
    apiKeyQuery:
      type: apiKey
      in: query
      name: api-key
    bearer:
      type: http
      scheme: bearer
  responses:
    Unauthorized: {description: "invalid or expired API key, bad token, or no credentials while AUTH_REQUIRED (auth/decorators.py:42-45, :174-175)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: "missing required scope (auth/decorators.py:51-52 and peers)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ServerError: {description: "ApiError 500, or an unhandled exception with message 'An internal error has occurred!' (exceptions.py:120-136)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      x-source: alerta/exceptions.py:98-107
      required: [status, message, code, errors, requestId]
      properties:
        status: {const: error}
        message: {type: string}
        code: {type: integer}
        errors: {description: "null or a list of strings"}
        requestId: {type: [string, "null"]}
    Heartbeat:
      type: object
      x-source: alerta/models/heartbeat.py:93-111
      description: |
        Every derived field is recomputed on each read, using the **app**
        clock. The SQL `latency` and `since` columns are ignored
        (lifecycle HB2).
      properties:
        id: {type: string, description: "uuid4 unless supplied; the stored id wins on upsert (HB0.1)"}
        href: {type: string, description: "absolute URL /heartbeat/<id>"}
        origin: {type: string}
        tags: {type: array, items: {type: string}, description: "stored as sent; duplicates are kept"}
        attributes: {type: object}
        type: {type: string, description: "always `Heartbeat` from POST: the parser does not read `type` (heartbeat.py:84-92)"}
        createTime: {type: string, description: "UTC YYYY-MM-DDThh:mm:ss.sssZ; client-supplied or server now"}
        timeout: {type: integer, description: "seconds"}
        maxLatency: {type: integer, description: "config HEARTBEAT_MAX_LATENCY (ms); not stored"}
        receiveTime: {type: string}
        customer: {type: [string, "null"]}
        latency: {type: integer, description: "int((receiveTime - createTime) in ms); negative when the client clock is ahead"}
        since: {type: integer, description: "int seconds since receiveTime (format.py:41-42)"}
        status:
          enum: [ok, slow, expired]
          description: |
            Computed from **untruncated** values (`heartbeat.py:61`,
            `:65-69`): `expired` if the elapsed
            `timedelta.total_seconds()` > timeout; otherwise `slow` if the
            integer latency > maxLatency; otherwise `ok`.
            - The serialized `since` is truncated to an integer
              (`format.py:41-42`). With timeout 2 and 2.5 s elapsed, the
              response shows `since: 2` together with `status: expired`.
            - Do not derive `status` from the response integers.
            - The SQL list filter (HB4.1) uses its own untruncated latency
              threshold and query-time clock.
    HeartbeatInput:
      type: object
      x-source: alerta/models/heartbeat.py:28-62, :72-91; alerta/utils/format.py:53-61
      additionalProperties: true
      description: |
        This schema describes what the **parser accepts**; it adds no
        validation of its own. Unknown fields are ignored.
        - `request.json` behavior is inferred from Flask, NOT verified: a
          non-JSON content type gives 415 and malformed JSON gives 400
          (werkzeug handlers, `exceptions.py:83-94`). A JSON body that is
          not an object makes `json.get` raise AttributeError, which is not
          a ValueError, so it gives 500.
      properties:
        id: {type: [string, "null"], description: "falsy gives a server uuid4"}
        origin: {description: "falsy gives `<argv0>/<hostname>` of the server"}
        tags:
          type: [array, "null"]
          description: |
            Must be a list when present (400 otherwise). Element types are
            **not** checked by the parser. Persisting non-string elements is
            not established.
        attributes: {type: [object, "null"], description: "must be an object when present (400); keys containing `.` or `$` give 400 (:30-32)"}
        createTime:
          description: |
            A string must match `%Y-%m-%dT%H:%M:%S.%fZ` (400 otherwise). A
            non-string value, including null and numbers, is **silently
            ignored**: `DateTime.parse` returns None, so the server uses now
            (`format.py:55-57`).
        timeout:
          type: [integer, boolean, "null"]
          description: |
            - null or absent gives `HEARTBEAT_TIMEOUT` (`:34`).
            - Booleans pass the int check (true gives 1, false gives 0).
            - Floats and strings give 400. A negative value gives 400.
        customer:
          type: [string, "null"]
          description: |
            `""` gives 400. A null value is accepted and then assigned by
            `assign_customer` (C11). A non-empty value goes through the same
            assignment rules.
paths:
  /heartbeat:
    post:
      operationId: createHeartbeat
      x-source: alerta/views/heartbeats.py:17-40
      x-scope: write:heartbeats
      summary: Create or upsert a heartbeat, keyed on (origin, customer)
      description: |
        - `ON CONFLICT (origin, COALESCE(customer, ''))` updates tags,
          attributes, create_time, timeout and receive_time, and keeps the
          stored `id` (`pg.py:851-861`; HB0.1).
        - Heartbeats can also arrive as alerts whose event is `Heartbeat`.
          That path answers 202 and is documented with `/alert` (HB3.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HeartbeatInput'}
      responses:
        "201":
          description: Created or updated
          content:
            application/json:
              schema:
                type: object
                required: [status, id, heartbeat]
                properties:
                  status: {const: ok}
                  id: {type: string}
                  heartbeat: {$ref: '#/components/schemas/Heartbeat'}
        "400": {description: "parse error, or customer not allowed (C7, C10)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
      x-runtime: "NOT_RUN; Codex heartbeat vectors 9548f878 are approved as source and cover this 201 shape, upsert identity and slow status once executed"
  /heartbeat/{heartbeat_id}:
    parameters:
      - name: heartbeat_id
        in: path
        required: true
        schema: {type: string}
        description: |
          Matched as `id = <v> OR id LIKE '<v>%'`, so a **prefix** matches
          (`pg.py:863-872`). When several rows share the prefix, which one
          is returned is undefined.
    get:
      operationId: getHeartbeat
      x-source: alerta/views/heartbeats.py:43-54
      x-scope: read:heartbeats
      description: |
        **No customer filter.** The view passes `g.get('customer')`
        (singular), which is never set, so any customer's heartbeat is
        returned (C19, HB4.2).
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                type: object
                required: [status, total, heartbeat]
                properties:
                  status: {const: ok}
                  total: {const: 1}
                  heartbeat: {$ref: '#/components/schemas/Heartbeat'}
        "404": {description: "not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteHeartbeat
      x-source: alerta/views/heartbeats.py:91-108
      x-scope: write:heartbeats
      description: |
        No customer filter, as for GET (C19).
        1. The lookup matches `id = v OR id LIKE 'v%'`. If several rows
           match, which one is chosen is undefined.
        2. `delete()` passes that row's full id to `delete_heartbeat`,
           which **again** uses `id = <id> OR id LIKE '<id>%'`
           (`heartbeat.py:178-179`, `pg.py:929-935`).

        So the deletion is not guaranteed to be exact-row. With a short
        caller id, a row `SYNTHETIC-a` also matches `SYNTHETIC-ab`. Generated
        full-uuid ids make this practically exact. This is source-derived,
        and the multi-row outcome is NOT verified. alrust keeps it unless
        the owner approves a divergence.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: ok}}}
        "404": {description: "not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
  /heartbeats:
    get:
      operationId: listHeartbeats
      x-source: alerta/views/heartbeats.py:57-88
      x-scope: read:heartbeats
      description: |
        Filtered by `customers=g.customers` (customer-mapping C16).

        **total and paging:** `total`, `pages` and `more` come from
        `COUNT(1)` over the query **without** the status filter
        (`hbv.py:62-66`, `pg.py:921-927`; HB4.1a).
        - A non-empty page reports the unfiltered total.
        - An empty page returns `total: 0` with `message: "not found"`
          (`hbv.py:78-87`).

        **Status filter:** evaluated in SQL on `NOW() at time zone 'utc'`,
        with untruncated latency. It can therefore disagree with the
        serialized `status` near the boundaries (HB4.1).

        **Order:** unordered unless `sort-by` is given (`(select 1)`,
        `pg/utils.py:50-51`).
      parameters:
        - {name: status, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "repeatable and arbitrary. `ok`, `slow` and `expired` each add an OR branch in SQL; any other value is ignored, so `status=foo` alone applies no status predicate (pg.py:886-908)"}
        - {name: page, in: query, schema: {type: integer, default: 1}, description: "out of range gives 416 (paging.py:15-16)"}
        - {name: page-size, in: query, schema: {type: integer}, description: "default DEFAULT_PAGE_SIZE (50); `limit` is the deprecated alias (paging.py:19-25)"}
        - {name: sort-by, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "one of origin, tags, attributes, attributes.<k>, type, createTime, timeout, receiveTime, customer, latency, since; a `-` prefix reverses it. Anything else gives 400 (pg/utils.py:28-49, :273-288)"}
        - name: filters
          in: query
          style: form
          explode: true
          schema: {type: object, additionalProperties: {type: string}}
          description: |
            The accepted filter names are `origin`, `tag`, `attributes`,
            `attributes.<k>`, `type`, `createTime`, `timeout`, `receiveTime`,
            `customer`, `latency` and `since` (`pg/utils.py:55-104`,
            `:273-288`). Excluded names are **silently ignored**: `id` and
            the paging, sort and credential parameters (`EXCLUDE_FROM_QUERY`,
            `:19-22`). Any other name gives 400 `Invalid filter parameter`.

            **Generic path** (every name except `attributes.<k>`):
            - a single value means equality; `~v` means ILIKE `%v%`; a `!`
              suffix negates;
            - several values mean `= ANY(...)`, or a regex when any value
              starts with `~`.

            **`attributes.<k>=v`** (`:69-72`) always becomes
            `attributes @> {k: <first value>}`:
            - extra values are ignored, and `~` is taken literally;
            - a trailing `!` becomes **part of the key name**; it does not
              negate.

            **Inferred SQL failures, giving 500, NOT verified:**
            - `tag` compares the `tags` text[] column with a string;
            - plain `attributes` compares the jsonb column with a string;
            - `type` maps to column `event_type`, but the table's column is
              `type` (`sql/schema.sql:109-118`, `pg/utils.py:280`). This
              also breaks `sort-by=type`;
            - `latency` and `since` are SELECT aliases, not columns.
      responses:
        "200":
          description: A page, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [status, page, pageSize, pages, more, heartbeats, total]
                properties:
                  status: {const: ok}
                  page: {type: integer}
                  pageSize: {type: integer}
                  pages: {type: integer}
                  more: {type: boolean}
                  heartbeats: {type: array, items: {$ref: '#/components/schemas/Heartbeat'}}
                  total: {type: integer}
                  message: {const: not found, description: "present only when the page is empty"}
        "400": {description: "invalid filter or sort parameter", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "416": {description: "page out of range", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
security:
  - apiKeyHeader: []
  - apiKeyAuthorization: []
  - apiKeyQuery: []
  - bearer: []
  - {}

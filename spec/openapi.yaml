        "200":
          description: A page, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [status, page, pageSize, pages, more, heartbeats, total]
                properties:
                  status: {const: ok}
                  page: {type: integer}
                  pageSize: {type: integer}
                  pages: {type: integer}
                  more: {type: boolean}
                  heartbeats: {type: array, items: {$ref: '#/components/schemas/Heartbeat'}}
                  total: {type: integer}
                  message: {const: not found, description: "present only when the page is empty"}
        "400": {description: "invalid filter or sort parameter", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "416": {description: "page out of range", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/ServerError'}
  /alert:
    post:
      operationId: receiveAlert
      x-source: alerta/views/alerts.py:38-85; alerta/utils/api.py:14-90
      x-scope: write:alerts
      summary: Receive an alert (create, deduplicate or correlate)
      description: |
        Lifecycle R0-R7 specify the processing. Order: parse (400),
        `assign_customer` (400), then pre-receive plugins and the
        duplicate/correlate/create dispatch (R1).

        Error mapping in this view (`:55-77`):
        - RejectException gives **403** (R1.2).
        - RateLimit gives **429** with body `{status: error, message, id}`,
          which is **not** the Error shape. No bundled plugin raises
          RateLimit, so the default configuration never returns 429.
        - HeartbeatReceived, BlackoutPeriod and ForwardingLoop give **202**
          (see the response below).
        - Another AlertaException gives its own code.
        - Any other exception gives 500 whose `message` is the exception
          text, **not** the generic `An internal error has occurred!`. This
          includes the R1.1 wrap: an unknown severity gives 500.

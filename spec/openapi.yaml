    get:
      operationId: authLogout
      x-source: alerta/auth/logout.py:7-14; alerta/auth/__init__.py:27-33, :50-51; alerta/settings.py:152
      x-scope: none
      summary: Report the OIDC end-session URL (no server-side logout)
      security: [{}]
      description: &authLogout |
        No permission decorator, and no body is read. The auth blueprint's
        JSON Content-Type check is skipped for this path
        (`auth/__init__.py:50-51`), so a POST needs no JSON. GET and POST run
        the same handler; `OPTIONS` is handled by `cross_origin`.
        1. `OIDC_LOGOUT_URL` falsy: 200 `{status: ok, message: 'OIDC
           end_session_endpoint not configured'}` (`logout.py:11-12`).
        2. Otherwise: 200 `{status: ok, logoutUrl: <OIDC_LOGOUT_URL>}`
           (`:14`).

        `OIDC_LOGOUT_URL` defaults to null (`settings.py:152`). When
        `AUTH_PROVIDER` is `openid`, `azure`, `cognito`, `gitlab` or
        `keycloak`, blueprint registration replaces it with the discovery
        document's `end_session_endpoint` (null when the document has
        none), overriding any configured value, and sets `OIDC_AUTH_URL`
        from `authorization_endpoint`; a discovery failure there aborts
        startup with RuntimeError (`auth/__init__.py:27-33`). `google` is
        not in that list, so with `AUTH_PROVIDER=google` the configured
        value (default null) stays.

        Nothing is invalidated. Tokens are stateless JWTs and parsing checks
        only signature, audience and times (`models/token.py:43-53`); there
        is no revocation list, so a token stays valid until `exp`.


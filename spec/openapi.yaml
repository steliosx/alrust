    TokenClaims:
      type: object
      x-source: alerta/models/token.py:78-118; alerta/auth/utils.py:52-73
      description: |
        Output of `Jwt.serialize` at issue time (`create_token` then
        `tokenize`): the JWT payload **as issued** by every login route.
        `/userinfo` echoes a parsed and re-serialized token and uses the
        wider UserinfoClaims schema instead. Values taken from an external
        identity provider (OIDC `name`, `picture`, `email_verified`, role
        and group claims) carry whatever JSON types the provider sent. The
        first eight members are always
        present (null when unset). Members marked *truthy* are omitted when
        empty or false; `email_verified` and `picture` are omitted only when
        null; `customers` is present (possibly `[]`) exactly when
        `CUSTOMER_VIEWS` is on (`models/token.py:111-112`). No other claim

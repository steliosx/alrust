          (DB clock). `EXTRACT` returns `numeric` on PostgreSQL 14 and
          later, the driver returns a Decimal, and `CustomJSONEncoder`
          serializes Decimal as a **string** (`utils/format.py:43-44`). So
          an expired blackout shows `"0"` and an active one a decimal
          string of seconds. Source-derived and body-probed; **runtime

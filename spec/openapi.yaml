           body (`{}`, `[]`, `null`, `false`, `0`, `""`) or a non-JSON
           content type falls through to the form, then to the raw text:
           POST `{}` delivers the string `'{}'`. No 415 is raised: the `api`
           blueprint's JSON content-type check does not apply to this
           blueprint. No `?callback=` JSONP wrapping (no `jsonp` decorator).
        6. `incoming(path=..., query_string=request.args, payload=...)`.

          falsy one becomes a new uuid4 (`models/customer.py:15`).
        - A missing `match` (NOT NULL) or a duplicate `id` gives 500 with
          the **database error text** (`:26-29`). A duplicate `match` is
          accepted (no unique constraint). A null `customer` is stored.

        "400": {description: "missing or empty attributes", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "404": {description: "not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {description: "resulting attribute map is empty (after commit), or other failure", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

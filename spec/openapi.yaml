      operationId: deleteAlert
      x-source: alerta/views/alerts.py:276-306; alerta/utils/api.py:203-221
      x-scope: delete:alerts
      description: |
        1. Lookup as for GET (404 when missing).
        2. `process_delete` evaluates `delete = delete and
           plugin.delete(...)` over the routed plugins (`utils/api.py:210`).
           - **Veto short-circuit:** once a plugin returns a falsy value
             (false or None), later plugins' `delete` is not called, and
             the local `alert.delete()` is skipped (`:221`). The view then
             answers 500 `failed to delete alert` (`views/alerts.py:303-306`).
             The only guarantee is that the framework's local
             `alert.delete()` call is skipped. Nothing is rolled back:
             earlier plugins may already have written locally or forwarded
             a delete (the forwarder makes remote calls,
             `plugins/forwarder.py:107-124`). No atomicity is claimed for
             custom or routed plugins.
           - NotImplementedError is ignored and leaves `delete` unchanged.
           - RejectException gives 400 and another AlertaException gives
             its own code (`utils/api.py:213-214`, `views/alerts.py:290-296`).
           - Any other exception: with `PLUGINS_RAISE_ON_ERROR` (default
             true) it becomes a 500 and the local `alert.delete()` is
             skipped, with the same no-rollback caveat; with it false it is
             logged, `delete` keeps its previous value, and the loop
             continues.
           - Of the default `PLUGINS` (`settings.py:272`), `remote_ip`,
             `reject`, `heartbeat` and `blackout` raise NotImplementedError;
             the forwarder returns true (`plugins/forwarder.py:101-126`). So
